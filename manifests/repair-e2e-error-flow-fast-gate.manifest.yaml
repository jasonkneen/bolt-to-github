schema: '2'
goal: 'Keep E2E error-flow behavior out of the fast MAID test gate'
description: |
  Supersede repair-e2e-error-flow-product-behavior so its browser-layer
  Playwright command no longer blocks ./scripts/maid test --manifest-dir
  manifests with E231. The product behavior remains covered by the focused
  Vitest suites, lint, and svelte-check in the fast MAID validate commands.
  The historical Playwright result stays in the superseded manifest Outcome as
  release evidence, but browser E2E execution is not part of the fast MAID
  behavioral gate.
temptations:
  - risk: 'Do not directly edit the completed repair-e2e-error-flow-product-behavior manifest.'
    instead: 'Supersede it with a new active manifest so the removed browser validate command is explicit in manifest history.'
  - risk: 'Do not hide E231 by deleting product behavior coverage from the fast gate.'
    instead: 'Keep the focused Vitest suites, lint, and check commands that cover repository validation and push failure UI behavior.'
  - risk: 'Do not reintroduce Playwright or other browser-layer commands under validate.'
    instead: 'Leave browser E2E commands as outcome/manual release evidence outside the MAID fast test command list.'
type: fix
supersedes:
  - repair-e2e-error-flow-product-behavior
files:
  edit:
    - path: src/lib/utils/repo-settings.ts
      artifacts:
        - kind: function
          name: validateRepositoryName
          args:
            - name: repoName
              type: string
          returns: RepositoryNameValidationResult
          description: |
            Signature: validateRepositoryName(repoName: string) => { isValid: boolean; error?: string }.
            Validates the product repository-name policy: required, 100-character
            maximum, alphanumeric/underscore/hyphen/dot characters, plus the
            product-specific readability rule that names cannot start/end with a
            hyphen or contain double hyphens.
        - kind: function
          name: canSaveForm
          args:
            - name: repoName
              type: string
            - name: branch
              type: string
            - name: isSaving
              type: boolean
          returns: boolean
          description: |
            Signature: canSaveForm(repoName: string, branch: string, isSaving?: boolean) => boolean.
            Preserves the existing save gate while also rejecting invalid repository
            names so disabled save states match the visible validation message.
    - path: src/lib/components/RepoSettings.svelte
      artifacts:
        - kind: function
          name: RepoSettings
          args:
            - name: props
              type: RepoSettings component props
          returns: Svelte component instance
          description: |
            Shows repository-name validation feedback in the modal settings surface,
            disables saving while invalid, and clears the error after correction.
    - path: src/lib/components/GitHubSettings.svelte
      artifacts:
        - kind: function
          name: GitHubSettings
          args:
            - name: props
              type: GitHubSettings component props
          returns: Svelte component instance
          description: |
            Shows repository-name validation feedback in the settings tab surface,
            keeps editable project fields as local drafts until save, disables saving
            while invalid, and clears the error after correction.
    - path: src/background/BackgroundService.ts
      artifacts:
        - kind: class
          name: BackgroundService
          description: |
            Push-to-GitHub runtime messages must respond with success only after a
            Bolt tab and content-script port are available, and must return a visible
            failure response when dispatch cannot start.
    - path: src/lib/components/ProjectStatus.svelte
      artifacts:
        - kind: function
          name: ProjectStatus
          args:
            - name: props
              type: ProjectStatus component props
          returns: Svelte component instance
          description: |
            Handles failed Push to GitHub responses from the background service with
            a visible, retry-safe popup error state.
    - path: src/popup/components/FileChangesModal.svelte
      artifacts:
        - kind: function
          name: FileChangesModal
          args:
            - name: props
              type: FileChangesModal component props
          returns: Svelte component instance
          description: |
            Handles failed Push to GitHub responses from the background service with
            a visible modal error state while preserving retry and confirmation flows.
    - path: src/lib/components/__tests__/RepoSettings.logic.test.ts
      artifacts:
        - kind: test_function
          name: validates GitHub repository names before save
        - kind: test_function
          name: rejects repository names outside the product policy
    - path: src/lib/components/__tests__/RepoSettings.component.test.ts
      artifacts:
        - kind: test_function
          name: shows repository validation errors and disables save
        - kind: test_function
          name: clears repository validation errors after correction
    - path: src/lib/components/__tests__/GitHubSettings.component.test.ts
      artifacts:
        - kind: test_function
          name: shows repository validation errors in GitHub settings
        - kind: test_function
          name: clears GitHub settings repository validation errors after correction
        - kind: test_function
          name: updates visible repository drafts after switching projects
    - path: src/lib/components/__tests__/ProjectStatus.component.test.ts
      artifacts:
        - kind: test_function
          name: shows an error when Push to GitHub cannot start
        - kind: test_function
          name: keeps the Push to GitHub control retryable after failure
    - path: src/popup/components/__tests__/FileChangesModal.component.test.ts
      artifacts:
        - kind: test_function
          name: displays push failure errors returned by the background service
        - kind: test_function
          name: keeps push retry available after a failed modal push
    - path: src/background/__tests__/BackgroundService.reload.test.ts
      artifacts:
        - kind: test_function
          name: push message responds with failure when no active Bolt tab exists
        - kind: test_function
          name: push message responds with failure when the Bolt tab has no connected port
        - kind: test_function
          name: push message responds successfully after dispatching to a connected Bolt port
    - path: src/test/e2e-helpers/popup-helpers.test.ts
      artifacts:
        - kind: test_function
          name: fills only visible repository settings controls
        - kind: test_function
          name: clicks the visible push button and confirmation after the hook
        - kind: test_function
          name: reads visible validation errors from alert surfaces
        - kind: test_function
          name: waits for visible error notifications
        - kind: test_function
          name: exports the extension Playwright fixture
    - path: e2e/helpers/popup.ts
      artifacts:
        - kind: function
          name: fillRepositorySettings
          args:
            - name: page
              type: Page
            - name: settings
              type: RepositorySettingsInput
          returns: Promise<void>
          description: |
            Signature: fillRepositorySettings(page: Page, settings: { repoName: string; branch?: string; visibility?: 'public' | 'private' }) => Promise<void>.
            Accepts structured repository settings input for the active popup state
            and fills only visible controls.
        - kind: function
          name: clickPushButton
          args:
            - name: page
              type: Page
            - name: beforeClick
              type: (() => Promise<void>) | undefined
          returns: Promise<void>
          description: |
            Signature: clickPushButton(page: Page, beforeClick?: () => Promise<void>) => Promise<void>.
            Clicks the current visible Push to GitHub control and supports retry
            after an error without relying on hidden duplicate buttons.
        - kind: function
          name: getValidationError
          args:
            - name: page
              type: Page
          returns: Promise<string | null>
          description: |
            Signature: getValidationError(page: Page) => Promise<string | null>.
            Reads visible validation or alert text from the active popup surface.
        - kind: function
          name: waitForErrorNotification
          args:
            - name: page
              type: Page
          returns: Promise<string>
          description: |
            Signature: waitForErrorNotification(page: Page) => Promise<string>.
            Waits for the active popup error alert and returns its text, falling
            back to Unknown error only when the alert has no text content.
    - path: e2e/fixtures/extension.ts
      artifacts:
        - kind: attribute
          name: test
          type: Playwright test fixture
          description: |
            Signature: test = base.extend<ExtensionFixtures>({ context, extensionId }).
            Provides the extension-loaded Playwright context used by
            e2e/error-flow-product.spec.ts and prevents install onboarding pages
            from stealing focus during E2E runs by closing only bolt2github.com
            welcome/onboarding pages inside that context, and derives the
            extension ID from the MV3 service worker instead of opening the
            chrome://extensions management page.
  read:
    - manifests/repair-e2e-error-flow-product-behavior.manifest.yaml
    - e2e/helpers/storage.ts
    - src/popup/App.svelte
    - src/lib/components/ProjectsList.svelte
    - src/lib/services/chromeMessaging.ts
    - src/lib/components/ui/alert/Alert.svelte
    - src/lib/components/ui/dialog/ConfirmationDialog.svelte
validate:
  - pnpm exec vitest run src/test/e2e-helpers/popup-helpers.test.ts src/lib/components/__tests__/RepoSettings.logic.test.ts src/lib/components/__tests__/RepoSettings.component.test.ts src/lib/components/__tests__/GitHubSettings.component.test.ts src/lib/components/__tests__/ProjectStatus.component.test.ts src/popup/components/__tests__/FileChangesModal.component.test.ts src/background/__tests__/BackgroundService.reload.test.ts
  - pnpm lint
  - pnpm check
created: '2026-07-04T09:15:00Z'
metadata:
  tags:
    - maid
    - e2e
    - fast-gate
    - errors
  priority: critical
outcome:
  status: completed
  summary: |
    Superseded repair-e2e-error-flow-product-behavior with a fast-gate manifest
    that removes the Playwright browser command from MAID validate commands,
    keeps the product behavior covered by focused Vitest, lint, and svelte-check
    gates, and adds fast characterization coverage for the E2E popup helpers
    that remain part of the contract.
  rationale: |
    MAID test treats Playwright/browser commands as E2E-layer validation, so the
    completed product-behavior manifest could not stay active without blocking
    ./scripts/maid test --manifest-dir manifests with E231. Superseding it keeps
    the contract history explicit, skips the old manifest in the chain, and
    leaves the historical Playwright pass as outcome evidence rather than a fast
    behavioral gate.
  lessons:
    - lesson_type: maid-contract
      summary: |
        Browser E2E commands should not live in active manifest validate lists
        when the repository expects ./scripts/maid test --manifest-dir manifests
        to be the fast behavioral gate. Keep browser evidence in Outcome or
        manual release validation, and cover declared helper exports with fast
        tests if they remain active artifacts.
      tags:
        - maid
        - e2e
        - fast-gate
      paths:
        - manifests/repair-e2e-error-flow-fast-gate.manifest.yaml
        - src/test/e2e-helpers/popup-helpers.test.ts
        - e2e/helpers/popup.ts
  review_notes:
    - source: Russell read-only subagent review
      severity: no findings
      summary: |
        Reviewer reported no findings, confirmed the superseding manifest stays
        within scope, confirmed the validate list excludes Playwright/browser
        commands, and independently reran implementation validation plus full
        ./scripts/maid test --manifest-dir manifests successfully.
    - source: local implementation review
      severity: no findings
      summary: |
        Changed files are limited to the superseding manifest, fast helper
        characterization test, and the declared popup helper async textContent
        fix. MAID chain log marks repair-e2e-error-flow-product-behavior as
        SUPERSEDED and repair-e2e-error-flow-fast-gate as active.
  validation:
    - command:
        - pnpm
        - exec
        - vitest
        - run
        - src/test/e2e-helpers/popup-helpers.test.ts
      status: passed
      summary: Focused helper characterization suite passed 5 tests.
    - command:
        - pnpm
        - lint
      status: passed
      summary: ESLint completed successfully for src/**/*.{js,ts,svelte}.
    - command:
        - pnpm
        - check
      status: passed
      summary: svelte-check found 0 errors and 0 warnings.
    - command:
        - ./scripts/maid
        - validate
        - manifests/repair-e2e-error-flow-fast-gate.manifest.yaml
        - --mode
        - behavioral
      status: passed
      summary: Behavioral validation passed for the superseding manifest.
    - command:
        - ./scripts/maid
        - validate
        - manifests/repair-e2e-error-flow-fast-gate.manifest.yaml
        - --mode
        - implementation
      status: passed
      summary: Implementation validation passed for the superseding manifest.
    - command:
        - ./scripts/maid
        - validate
        - --manifest-dir
        - manifests
        - --mode
        - implementation
      status: passed
      summary: Directory implementation validation passed with 16 active manifests and 1 superseded manifest skipped.
    - command:
        - ./scripts/maid
        - test
        - --manifest
        - manifests/repair-e2e-error-flow-fast-gate.manifest.yaml
      status: passed
      summary: Superseding manifest test commands passed Vitest, lint, and check.
    - command:
        - ./scripts/maid
        - test
        - --manifest-dir
        - manifests
      status: passed
      summary: Full MAID test gate passed 5 commands with zero E231 browser-layer chain issues.

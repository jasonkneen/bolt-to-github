outcome:
  status: completed
  summary: |
    Promoted and implemented the content auth client migration. PremiumService
    now validates subscriptions through BackgroundAuthClient.validateSubscription()
    instead of dynamically importing and instantiating SupabaseAuthService in
    each content-script context. The source boundary guard now protects content,
    popup, lib, and page production code from runtime SupabaseAuthService access.
  rationale: |
    Content scripts no longer create an independent Supabase auth singleton, so
    premium checks cannot refresh or clear the shared Supabase session from
    every open bolt.new tab. Background runtime-message failures keep the
    existing cached-status fallback and visible warning behavior, without
    resurrecting a local auth-service fallback. Subscription invalidation now
    bypasses the throttled public premium updater so a server-side downgrade is
    applied immediately.
  lessons:
    - lesson_type: content-auth-boundary
      summary: |
        Content premium validation should use the shared BackgroundAuthClient
        runtime message endpoint; dynamic imports or getInstance calls to
        SupabaseAuthService in content code reintroduce the multi-context
        refresh-token race.
      tags:
        - auth
        - content-script
        - architecture
      paths:
        - src/content/services/PremiumService.ts
        - src/content/services/__tests__/PremiumService.auth-client.test.ts
    - lesson_type: boundary-guard-scope
      summary: |
        Auth boundary guard tests should distinguish runtime imports from
        type-only contracts and should scope the guard to user-facing extension
        contexts when existing service modules are constructed exclusively by
        the background service worker.
      tags:
        - auth
        - testing
        - maid
      paths:

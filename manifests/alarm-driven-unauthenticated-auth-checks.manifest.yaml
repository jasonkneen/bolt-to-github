outcome:
  status: completed
  summary: |
    SupabaseAuthService now keeps the auth-periodic-check Chrome alarm
    registered whenever chrome.alarms is available, including unauthenticated,
    initial-onboarding, and post-connection modes, while preserving short
    setInterval checks for responsive auth detection while the worker is awake.
  rationale: |
    MV3 service workers cannot rely on setInterval after suspension, so
    unauthenticated auth recovery needs an alarm wake-up path even though the
    user-facing onboarding and post-connection flows still need faster interval
    checks. The implementation separates alarm scheduling from interval
    scheduling, avoids clearing the alarm during mode transitions, and converts
    synchronous or asynchronous alarm scheduling failures into visible logging
    plus interval fallback instead of blocking re-authentication flow.
  lessons:
    - lesson_type: mv3-auth-periodic-checks
      summary: |
        For MV3 auth recovery, short awake intervals and Chrome alarms solve
        different lifecycle problems. Unauthenticated modes should keep both
        when alarms are available: intervals for responsiveness, alarms for
        service-worker wake-up.
      tags:
        - auth
        - mv3
        - alarms
      paths:
        - src/content/services/SupabaseAuthService.ts
        - src/content/services/__tests__/SupabaseAuthService.periodic-checks.test.ts
    - lesson_type: chrome-alarms-error-handling
      summary: |
        Chrome extension APIs can fail synchronously or by rejecting returned
        promises. Alarm scheduling code should observe both failure paths before
        deciding that an alarm-backed mode does not need interval fallback.
      tags:
        - chrome-extension
        - alarms
        - error-handling
      paths:
        - src/content/services/SupabaseAuthService.ts

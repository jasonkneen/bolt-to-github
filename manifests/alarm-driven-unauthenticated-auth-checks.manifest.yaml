# draft-kind: auth-lifecycle-fix (4 of 8)
schema: '2'
goal: 'Keep an alarm-driven auth check alive while unauthenticated'
type: fix
description: |
  Root cause: startPeriodicChecks() uses chrome.alarms only for AUTHENTICATED
  modes; in unauthenticated mode it falls back to setInterval AND explicitly
  clears the 'auth-periodic-check' alarm. If the service worker dies while
  unauthenticated (keepAlive failure, browser restart, profile reopen after
  weeks), no alarm exists to wake it for auth checks — recovery then depends
  entirely on tab-event listeners that are registered asynchronously and
  therefore do not wake a dead worker in MV3.

  Fix contract: in unauthenticated (non-aggressive) mode the service keeps a
  1-minute 'auth-periodic-check' alarm registered alongside the existing 30s
  setInterval (the interval provides responsiveness while awake; the alarm
  guarantees wake-ups). Aggressive onboarding/post-connection modes keep their
  short setIntervals but no longer clear the alarm. Authenticated-mode alarm
  behavior is unchanged.

  Rationale: the alarm handler already exists in
  BackgroundService.setupAlarms() and dispatches 'auth-periodic-check' to
  forceCheck(); this draft only guarantees the alarm survives every mode
  transition, closing the last wake-up gap in the unauthenticated state.
temptations:
  - risk: 'Do not drop the 30s setInterval in favor of alarm-only checks — Chrome clamps alarms to 1 minute and onboarding UX depends on faster detection while awake.'
    instead: 'Run both: setInterval for awake responsiveness, alarm for guaranteed wake-up; test that both exist in unauthenticated mode.'
  - risk: 'Do not test by inspecting the private checkInterval handle.'
    instead: 'Assert through the chrome.alarms mock (create called with auth-periodic-check and periodInMinutes >= 1, clear NOT called on unauthenticated transitions) and through observable check activity under fake timers.'

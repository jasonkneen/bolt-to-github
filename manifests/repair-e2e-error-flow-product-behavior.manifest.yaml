      severity: fixed finding
      summary: |
        Review found that touched GitHubSettings repository draft fields could
        stay stale after switching projects or receiving synchronized project
        settings. The implementation now applies synchronized repository
        settings through one helper that refreshes both committed and draft
        values, with component coverage for project switching.
    - source: local self-review

  tags:
    - auth
    - github-app
    - popup
    - content-script
    - user-visible-correctness
  priority: critical
  depends_on:
    - background-auth-message-endpoints
    - popup-auth-client-migration
    - prevent-github-token-request-stampede
  promotion_ready: true
  notes: |
    This contract supersedes the prior session-cleanup and edge-function-loop
    contracts while carrying their stable-identity and session-boundary
    artifacts forward. The existing syncGitHubApp Promise<boolean> signature is
    retained and its previously ambiguous success semantics are tightened.
    App.svelte exposes small injected guard functions so popup connection
    behavior is testable without adding test-only controls to the rendered UI.
    Plan-lock red evidence covers authoritative absence, transient and malformed
    failures, popup degraded states, push and comparison gates, cached modal
    bypasses, and late authentication error preservation.
outcome:
  status: completed
  summary: |
    GitHub-backed actions now require a live connection instead of trusting
    stale local GitHub App metadata. Popup initialization, toolbar and runtime
    push, displayed and programmatic file comparisons, cached file changes, and
    Issues surfaces all stop before protected work when verification fails.
    Authoritative absence clears stale App state; transient and malformed
    responses preserve durable state and remain visible. Late authentication
    failures retain their actionable message instead of becoming ZIP errors.
  rationale: |
    Local installation metadata cannot prove that the current Supabase user
    still owns a live GitHub App installation. Centralizing reconciliation
    behind the background auth authority prevents account-transition drift,
    while explicit PAT handling preserves the supported legacy path. Gating at
    every public action boundary protects both UI and background entry points.
  lessons:
    - lesson_type: auth-authority-boundary
      summary: |
        Durable local GitHub App metadata is configuration, not current-account
        authorization. Reconcile through the single background auth authority
        before enabling or starting GitHub-backed work.
      tags:
        - auth
        - github-app
        - mv3
      paths:
        - src/lib/utils/githubConnection.ts
        - src/content/services/SupabaseAuthService.ts
    - lesson_type: gate-public-entry-points
      summary: |
        UI-only gating is insufficient when reminder, runtime, cached-state,
        and programmatic APIs can reach the same operation. Gate every public
        entry point before dialogs, premium usage, file loading, ZIP export,
        comparison, or dispatch.
      tags:
        - auth
        - popup
        - reliability
      paths:
        - src/background/BackgroundService.ts
        - src/content/handlers/GitHubUploadHandler.ts
        - src/content/handlers/FileChangeHandler.ts
        - src/popup/App.svelte
  review_notes:

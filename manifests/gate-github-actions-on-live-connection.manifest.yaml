  - pnpm exec vitest run src/lib/utils/__tests__/githubConnection.test.ts src/content/services/__tests__/SupabaseAuthService.github-connection.test.ts src/content/services/__tests__/SupabaseAuthService.session-cleanup.test.ts src/content/services/__tests__/SupabaseAuthService.independent-session.test.ts src/content/services/__tests__/SupabaseAuthService.edge-function-loop.test.ts src/content/handlers/__tests__/GitHubUploadHandler.test.ts src/content/handlers/__tests__/FileChangeHandler.test.ts src/background/__tests__/BackgroundService.reload.test.ts src/background/__tests__/BackgroundService.storage-recovery.test.ts src/popup/__tests__/App.component.test.ts src/lib/utils/__tests__/githubAppSync.test.ts

outcome:
  status: completed
  summary: |
    BackgroundService now reacts to real chrome.storage.local auth-key changes,
    debounces recovery for about one second, forces a Supabase auth check, and
    rebuilds the GitHub service, ZipHandler, and TempRepoManager through the
    same dependency path used by sync settings changes.
  rationale: |
    Auth restoration from the popup or website tab writes to local storage, not
    sync storage. Listening only to sync settings left the long-lived background
    worker with stale in-memory auth and GitHub dependencies until a manual
    extension toggle. The local auth-key listener restores the background side
    without reacting to unrelated keep-alive storage writes or same-value token
    writes created by auth checks.
  lessons:
    - lesson_type: mv3-storage-recovery
      summary: |
        Background service workers that cache auth-dependent collaborators must
        listen to the same storage namespace used by the auth writers; otherwise
        cross-context recovery can update storage while leaving the worker stale.
      tags:
        - auth
        - mv3
        - storage
      paths:
        - src/background/BackgroundService.ts
    - lesson_type: debounce-loop-prevention
      summary: |
        Storage-change recovery should filter to the explicit contract keys,
        compare oldValue and newValue, and debounce before rebuilding expensive
        collaborators so keep-alive writes and auth-service echo writes do not
        create recovery loops.
      tags:
        - auth
        - storage
        - reliability
      paths:
        - src/background/BackgroundService.ts
        - src/background/__tests__/BackgroundService.storage-recovery.test.ts

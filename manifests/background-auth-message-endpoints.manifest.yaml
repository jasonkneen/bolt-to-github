outcome:
  status: completed
  summary: |
    Promoted and implemented the background auth message endpoint manifest.
    AuthMessageRouter now exposes typed runtime message handling for auth state,
    force checks, post-connection mode, GitHub App sync, subscription validation,
    and logout. BackgroundService delegates those auth messages through its
    existing runtime listener and propagates the router's synchronous boolean
    return without registering a second listener.
  rationale: |
    The background service remains the single auth authority while popup and
    content-script migrations can move to runtime messages in later manifests.
    The router keeps the auth message surface independently testable and wraps
    operation execution in a promise chain so both asynchronous rejections and
    synchronous auth-service failures are reported through sendResponse.
  lessons:
    - lesson_type: mv3-auth-message-routing
      summary: |
        Background auth message routers should be called from the existing MV3
        runtime listener and return literal true synchronously for handled async
        branches; adding another listener reintroduces sendResponse races.
      tags:
        - auth
        - mv3
        - messaging
      paths:
        - src/background/BackgroundService.ts
        - src/background/AuthMessageRouter.ts
    - lesson_type: fail-loud-runtime-responses
      summary: |
        Runtime message routers need to catch both rejected promises and
        synchronous collaborator throws before responding with
        {success:false,error}; testing only rejected promises can miss sync
        failures in void collaborators.
      tags:
        - testing
        - error-handling
        - mv3
      paths:
        - src/background/AuthMessageRouter.ts
        - src/background/__tests__/AuthMessageRouter.test.ts
  review_notes:
    - source: independent reviewer subagent Wegener
      severity: finding fixed
      summary: |
        Initial review found that synchronous auth-service failures could escape
        before the router catch handler was attached. The implementation was
        changed to execute operations through Promise.resolve().then(operation),
        and the existing failure test now covers a synchronous
        ENTER_POST_CONNECTION_MODE throw.
    - source: independent reviewer subagent Planck
      severity: ready
      summary: |
        Follow-up review found no remaining findings. Scope, declared artifacts,
        MV3 listener behavior, sync-throw error handling, and focused validation

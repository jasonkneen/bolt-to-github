  promotion_ready: true
  notes: |
    Promoted on 2026-07-04 after the session-cleanup behavioral spec was
    created and red phase was confirmed. The focused red phase failed for the
    intended missing clearExpiredSession API and the current re-auth flow wiping
    GitHub App configuration; explicit logout still cleared GitHub App state.
outcome:
  status: completed
  summary: |
    SupabaseAuthService now has a public clearExpiredSession() path for
    transient Supabase session expiry. Re-authentication, stale refresh-token
    cleanup, refresh failure cleanup, and session invalidation clear only the
    Supabase session artifacts while preserving authenticationMethod and
    GitHub App storage keys. Explicit user logout still performs the full
    logout notification path and clears GitHub App configuration.
  rationale: |
    GitHub App linkage belongs to the user's GitHub account and must survive
    Supabase session refresh or re-authentication. Splitting session-only
    cleanup from explicit logout prevents transient auth expiry from forcing
    the background GitHub service back to PAT-defaulted missing credentials,
    while preserving the existing full-wipe behavior needed for user/account
    switching.
  lessons:
    - lesson_type: auth-session-boundary
      summary: |
        Session expiry cleanup and explicit account logout need separate public
        service paths. Reusing logout for transient expiry can erase durable
        account configuration such as GitHub App installation state.
      tags:
        - auth
        - github-app
        - storage
      paths:
        - src/content/services/SupabaseAuthService.ts
    - lesson_type: centralized-session-keys
      summary: |
        Keep the Supabase session storage key list centralized so cleanup
        callers do not drift and miss session flags such as
        extensionSessionMinted or accidentally include GitHub App keys.
      tags:
        - auth
        - storage
        - reliability
      paths:
        - src/content/services/SupabaseAuthService.ts
        - src/content/services/__tests__/SupabaseAuthService.session-cleanup.test.ts

        - kind: test_function
          name: popup checks bypass cached verification after the authenticated user changes
        - kind: test_function
          name: popup checks refresh after the sixty-second cache window
        - kind: test_function
          name: popup checks bypass cached verification after the installation changes
        - kind: test_function
          name: popup checks do not cache disconnected results
    - path: src/popup/__tests__/App.component.test.ts

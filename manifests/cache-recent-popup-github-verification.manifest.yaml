outcome:
  status: completed
  summary: |
    Popup initialization now reuses a recent successful GitHub App verification
    for up to 60 seconds when the authenticated user, installation, and token
    expiry still match. Direct GitHub actions remain force-fresh. The popup's
    pending state now presents an accessible animated spinner with explanatory
    text instead of plain text alone.
  rationale: |
    A short success-only window removes redundant live synchronization during
    bursty popup openings without turning cached UI state into authorization.
    Binding the token-free cache record to user, installation, and exact expiry
    prevents reuse across account or installation transitions, while fresh
    action checks preserve fail-loudly protection at every operation boundary.
  lessons:
    - lesson_type: cache-advisory-ui-state-only
      summary: |
        Authentication caches are safest when they optimize advisory UI checks
        only and protected operations continue to cross the live authority
        boundary immediately before work starts.
      tags:
        - auth
        - cache
        - github-app
      paths:
        - src/lib/utils/githubConnection.ts
        - src/popup/App.svelte
    - lesson_type: bind-cache-to-stable-identity
      summary: |
        A short TTL alone is insufficient for account-sensitive state. Match
        the current user, stable installation, and exact credential expiry,
        and reject near-expiry credentials before reusing a success.
      tags:
        - auth
        - identity
        - expiry
      paths:
        - src/lib/utils/githubConnection.ts

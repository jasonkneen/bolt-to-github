schema: '2'
goal: Reuse recent successful popup GitHub verification while keeping actions force-fresh
type: feature
created: '2026-07-12T22:55:45Z'
description: |
  Opening the popup currently performs a live GitHub App synchronization every
  time, even when the same authenticated user and installation were verified a
  few seconds earlier. Add a popup-only connection function that can reuse a
  successful verification for 60 seconds. The cache is stored without tokens,
  is bound to the current Supabase user and stable installation ID, and is valid
  only while the stored GitHub App token remains valid beyond the cache window.

  Keep checkGitHubConnection unchanged as the force-fresh action boundary used
  by push, file changes, reminders, and other protected operations. Disconnected,
  unavailable, malformed, identity-mismatched, installation-mismatched, expired,
  and near-expiry states never produce a cache hit. A fresh successful action may
  refresh the popup verification timestamp, but actions never consume the cache.

  Replace the popup's plain checking text with an accessible status region using
  the existing lucide-svelte LoaderCircle animation and a short explanatory
  subtitle. No new tab, list item, permission, or authentication fallback is added.

  Rationale: a fixed 60-second success-only window removes bursty repeated popup
  calls while keeping remote disconnect exposure bounded. Using the full token
  expiration would retain stale connected UI for too long; force-fresh action
  checks remain the final authorization boundary.
temptations:
  - risk: Do not let push, file changes, reminders, or Issues actions consume the popup cache.
    instead: Add a separate popup entry point and keep checkGitHubConnection force-fresh by default.
  - risk: Do not cache disconnected, unavailable, malformed, expired, or near-expiry results.
    instead: Persist only successful verification metadata and require every identity and expiry guard before reuse.
  - risk: Do not key the cache only by time or installation ID.
    instead: Match the current Supabase user ID, stable installation ID, and token expiry on every popup lookup.
  - risk: Do not add another visible GitHub action or a decorative spinner without status semantics.
    instead: Replace only the existing checking text with an aria-live status region and animated LoaderCircle.
files:

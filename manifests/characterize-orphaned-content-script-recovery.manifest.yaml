outcome:
  status: completed
  summary: |
    Promoted and implemented the orphaned content-script recovery contract.
    ContentManager now surfaces the background self-heal reload notification,
    reaches the fallback refresh banner after true context invalidation, and
    shows the same fallback when initialization starts after chrome.runtime.id
    is already unavailable.
  rationale: |
    Extension reloads orphan existing bolt.new content scripts, so the content
    script must fail visibly and ask the user to refresh instead of silently
    dying or reloading the tab automatically. The implementation keeps the
    existing recovery ladder intact while removing the destroyed-state guard
    that prevented recovery retries from reaching the unrecoverable banner.
  lessons:
    - lesson_type: mv3-content-script-orphan-recovery
      summary: |
        Recovery callbacks scheduled after cleanup must key off the explicit
        recovery state, not the general destroyed flag, because cleanup marks
        the manager destroyed before the final runtime-availability retries.
      tags:
        - content-script
        - mv3
        - recovery
      paths:
        - src/content/ContentManager.ts
        - src/content/__tests__/ContentManager.orphan-recovery.test.ts
    - lesson_type: visible-degraded-state
      summary: |
        Background tab notifications such as SHOW_EXTENSION_RELOAD_NOTIFICATION
        need an explicit content-script onMessage branch; otherwise the only
        user-visible warning can be lost before the script is orphaned.
      tags:
        - content-script
        - degraded-state
      paths:
        - src/content/ContentManager.ts

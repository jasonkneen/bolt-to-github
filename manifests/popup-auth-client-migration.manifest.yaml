  notes: |
    Behavioral tests are added during promotion and red phase must be confirmed
    before production implementation. GitHubSettings.svelte, githubAppSync.ts,
    and the existing githubAppSync tests are call-site rewiring only
    (files.read); if their public surface must change during implementation,
    stop and evolve this manifest instead of widening scope silently.
outcome:
  status: completed
  summary: |
    Promoted and implemented the popup auth client migration. BackgroundAuthClient
    now wraps the background auth runtime messages for auth state, force checks,
    post-connection mode, GitHub App sync, subscription validation, and logout.
    Popup GitHub App connection paths and githubAppSync helpers now use the
    background client instead of instantiating SupabaseAuthService in the popup.
  rationale: |
    The popup now delegates auth authority to the background service worker,
    removing the local popup auth singleton that could race the background for
    rotating Supabase refresh tokens. Background transport and response errors
    fail loudly through thrown client errors, utility result messages, and the
    existing visible GitHub App connection error state.
  lessons:
    - lesson_type: popup-auth-boundary
      summary: |
        Popup auth migrations should introduce a typed runtime-message client
        and rewire call sites through that client; type-only AuthState imports
        are acceptable, but popup code must not instantiate SupabaseAuthService.
      tags:
        - auth
        - popup
        - architecture
      paths:
        - src/lib/services/BackgroundAuthClient.ts
        - src/lib/components/GitHubSettings.svelte
        - src/lib/utils/githubAppSync.ts
    - lesson_type: fail-loud-popup-runtime-client
      summary: |
        Runtime auth clients should validate response shape and throw on
        transport failure, success=false, or missing payload fields instead of
        returning a fake unauthenticated/default state.
      tags:
        - auth
        - error-handling
        - testing
      paths:
        - src/lib/services/BackgroundAuthClient.ts
        - src/lib/services/__tests__/BackgroundAuthClient.test.ts

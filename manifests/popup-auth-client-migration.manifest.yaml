# draft-kind: auth-lifecycle-refactor (6 of 8)
schema: '2'
goal: 'Popup consumes background auth via a message client, not its own instance'
type: refactor
description: |
  The popup currently calls SupabaseAuthService.getInstance() (GitHubSettings
  connect/refresh buttons, githubAppSync helpers), creating a full second auth
  service in the popup context: its own timers, its own tab listeners, its own
  token refreshes racing the background for the same rotating refresh token,
  and its own view of auth state that dies with the popup window. This is why
  "refresh the auth in the extension" repaired storage but never repaired the
  background.

  Fix contract: a new BackgroundAuthClient (src/lib/services/) wraps the draft-5
  message endpoints; popup code paths use it exclusively. The popup must not
  import or instantiate SupabaseAuthService in any code path. Existing exported
  signatures of githubAppSync.ts are preserved — only their internal auth
  access is rewired — so GitHubSettings.svelte and githubAppSync.ts are
  touched-but-uncontracted call-site rewiring (files.read), per repo MAID
  convention.

  Rationale: a thin typed client (rather than scattering raw sendMessage calls)
  gives one seam to fake in popup tests and one place to translate messaging
  errors into visible failures (fail-loud policy: a dead background must
  surface as an error state in the popup, not as silently stale data).
temptations:
  - risk: 'Do not leave a "temporary" SupabaseAuthService.getInstance() in any popup path for convenience — one leftover copy reintroduces the refresh-token race.'
    instead: 'Rewire every popup call site to BackgroundAuthClient; keep the no-direct-import guard test from draft 7 in mind (it scans popup and lib paths too).'
  - risk: 'Do not swallow sendMessage failures and return a default unauthenticated state as if it were real.'
    instead: 'Reject/return explicit error results so the popup UI can render a visible degraded state; test the background-unreachable case explicitly.'
  - risk: 'Do not mock chrome.runtime.sendMessage per-test with ad-hoc shapes.'
    instead: 'Drive tests through the draft-5 AuthMessageResponse contract so client and router cannot drift apart.'
files:
  create:
    - path: src/lib/services/BackgroundAuthClient.ts
      artifacts:
        - kind: class
          name: BackgroundAuthClient
          description: |
            Message-based client for the background auth authority. Constructor
            takes no arguments and performs no I/O; every method sends one
            typed runtime message and translates the AuthMessageResponse,
            throwing on transport failure or success=false.
        - kind: method
          name: getAuthState
          of: BackgroundAuthClient
          args: []
          returns: Promise<AuthState>
        - kind: method
          name: forceCheck
          of: BackgroundAuthClient
          args: []
          returns: Promise<void>
        - kind: method
          name: enterPostConnectionMode
          of: BackgroundAuthClient
          args: []
          returns: Promise<void>
        - kind: method
          name: syncGitHubApp
          of: BackgroundAuthClient
          args: []
          returns: Promise<boolean>
        - kind: method
          name: validateSubscription
          of: BackgroundAuthClient
          args: []
          returns: Promise<boolean>
        - kind: method
          name: logout
          of: BackgroundAuthClient
          args: []
          returns: Promise<void>
    - path: src/lib/services/__tests__/BackgroundAuthClient.test.ts
      artifacts:
        - kind: test_function
          name: getAuthState returns the auth state provided by the background
        - kind: test_function
          name: forceCheck resolves when background acknowledges
        - kind: test_function
          name: enterPostConnectionMode sends the post-connection message
        - kind: test_function
          name: syncGitHubApp and validateSubscription return background results
        - kind: test_function
          name: logout resolves on background acknowledgement
        - kind: test_function
          name: transport failure surfaces as a thrown error not a fake state
        - kind: test_function
          name: background error responses are thrown with the background message
  read:
    - src/lib/components/GitHubSettings.svelte
    - src/lib/utils/githubAppSync.ts
    - src/lib/utils/__tests__/githubAppSync.test.ts
    - src/background/AuthMessageRouter.ts
    - src/content/services/SupabaseAuthService.ts
validate:
  - pnpm exec vitest run src/lib/services/__tests__/BackgroundAuthClient.test.ts src/lib/utils/__tests__/githubAppSync.test.ts
  - pnpm lint
  - pnpm check

temptations:
  - risk: Do not present the snapshot as a security audit, AI review, or production guarantee.
    instead: Render evidence-based language, confidence, and static-analysis limitations from the snapshot/report contracts.
  - risk: Do not block export by default when the snapshot is Red.
    instead: Show a clear warning and reserve blocking behavior for an explicit settings-controlled follow-up.
  - risk: Do not use native alert, confirm, or prompt dialogs for copy, handoff, error, or degraded states.
    instead: Use visible Svelte UI states, existing button patterns, and callback-driven actions.
  - risk: Do not hide critical safety facts behind Pro gating.
    instead: Always render critical state, top concerns, and redaction-safe limitations; gate only deeper artifacts if a separate monetization draft requires it.

# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Display PRS readiness state, top metrics, top concerns, safe-looking areas,
  evidence details, limitations, and report actions in the extension UI.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 4, 5, 10,
  14, 15, 16, 17, and 19.3 Child 13.

  This is planning inventory only. It is not promotion-ready until the composer
  and report generator contracts exist and the extension integration point is
  selected. Promotion should narrow whether this panel lives in HomeTabContent,
  FileChangesModal, a new component mounted by App.svelte, or a dedicated
  export-flow surface.

  Rationale:
  - The panel should make Green, Yellow, Red, confidence, and limitations clear
    without claiming to be a security audit or code review.
  - The default MVP should warn, not block export, unless a separate settings
    draft explicitly adds blocking behavior.
  - Copy receipt and generate handoff are deliberate user actions. External
    ADC Fix navigation must be explicit.
type: feature
files:
  create:
    - path: src/popup/components/ProductionReadinessPanel.svelte
      artifacts:
        - kind: function
          name: ProductionReadinessPanel
          args:
            - name: props
              type: ProductionReadinessPanelProps
          returns: Svelte component instance
          description: |
            Renders the latest readiness snapshot with state badge, confidence,
            key metrics, top concerns, safe-looking areas, limitations, evidence
            details, and actions for copying receipts and generating ADC Fix
            handoff reports.
        - kind: type
          name: ProductionReadinessPanelProps
          type: |
            {
              snapshot: ReadinessSnapshot | null;
              isLoading?: boolean;
              error?: string | null;
              onCopyReceipt: (snapshot: ReadinessSnapshot) => Promise<void> | void;
              onGenerateHandoff: (snapshot: ReadinessSnapshot) => Promise<void> | void;
              allowBlockingExport?: boolean;
            }
    - path: src/popup/components/__tests__/ProductionReadinessPanel.component.test.ts
      artifacts:
        - kind: test_function
          name: renders Green Yellow and Red readiness states with confidence
          description: |
            Planned component test asserting state, confidence, headline, and
            recommended action render for the three fixture snapshots.
        - kind: test_function
          name: renders partial snapshots with visible limitations
          description: |
            Planned component test proving low confidence and missing-data
            limitations are visible, not hidden in developer-only output.
        - kind: test_function
          name: invokes copy receipt and generate handoff actions
          description: |
            Planned component test clicking the receipt and handoff controls and
            verifying callbacks receive the current snapshot.
        - kind: test_function
          name: does not block existing export flow by default
          description: |
            Planned component or integration test verifying Red state displays a
            warning but does not disable existing export controls unless
            allowBlockingExport is explicitly true.
        - kind: test_function
          name: renders loading and error states without native dialogs
          description: |
            Planned component test ensuring degraded UI states are visible and
            no window.alert, window.confirm, or window.prompt behavior is used.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md

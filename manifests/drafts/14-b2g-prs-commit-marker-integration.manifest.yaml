temptations:
  - risk: Do not silently append PRS metadata to every commit.
    instead: Gate marker insertion behind an explicit user setting or export-flow action and test both enabled and disabled paths.
  - risk: Do not include full reports, raw evidence dumps, or secret-looking values in commit bodies.
    instead: Generate only compact state and top-concern metadata after the same redaction boundary used by reports.
  - risk: Do not treat fallback generic GitHub commits as equivalent to B2G PRS markers.
    instead: Parse marker provenance explicitly and let the history engine label fallback history with lower confidence.
  - risk: Do not make malformed historical markers fail current exports.
    instead: Ignore malformed marker blocks, record a limitation where useful, and keep current commit generation deterministic.

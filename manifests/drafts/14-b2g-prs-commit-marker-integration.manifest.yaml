# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Optionally append compact PRS metadata to commit bodies and parse prior PRS
  markers from repository history for later baseline analysis.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 9, 14.4,
  16, and 19.3 Child 14.

  This is planning inventory only. It is not promotion-ready until the export
  flow, commit message path, settings storage, and history baseline draft are
  reconciled. Promotion should decide whether marker insertion belongs in the
  background service commit-message path, FileService upload options, or a
  smaller commit-body adapter.

  Rationale:
  - Commit markers provide a low-cost way to discover prior B2G PRS snapshots
    without requiring an external datastore.
  - Marker inclusion should be opt-in or explicitly settings-controlled, not an
    automatic mutation of every commit body.
  - Marker parsing must be tolerant of missing, malformed, duplicate, or
    manually edited markers and must not treat generic repository commits as
    equally trustworthy history.
type: feature
files:
  create:
    - path: src/lib/prs/commitMarkers.ts
      artifacts:
        - kind: function
          name: generatePrsCommitMarker
          args:
            - name: snapshot
              type: ReadinessSnapshot
            - name: options
              type: PrsCommitMarkerOptions
          returns: string
          description: |
            Generates a compact [B2G-PRS] commit-body marker containing
            readiness state, selected top concerns, optional output refs, and no
            raw secret-looking values.
        - kind: function
          name: appendPrsCommitMarker
          args:
            - name: commitBody
              type: string
            - name: marker
              type: string
          returns: string
          description: |
            Appends a PRS marker to a commit body without duplicating an
            existing marker block.
        - kind: function
          name: parsePrsCommitMarkers
          args:
            - name: commits
              type: GitCommitSummary[]
          returns: PrsHistoryMarker[]
          description: |
            Parses prior [B2G-PRS] marker blocks from commit messages into
            history records suitable for the history baseline engine.
        - kind: type
          name: PrsCommitMarkerOptions
          type: |
            {
              includeTopConcerns?: boolean;
              includeOutputRefs?: boolean;
              maxConcerns?: number;
            }
        - kind: type
          name: PrsHistoryMarker
          type: |
            {
              commitSha: string;
              committedAt?: string;
              state: ReadinessState;
              topConcerns: string[];
              source: 'b2g-prs-commit-marker';
            }
    - path: src/lib/prs/__tests__/commitMarkers.test.ts
      artifacts:
        - kind: test_function
          name: generatePrsCommitMarker formats the compact marker
          description: |
            Planned behavioral test covering the exact [B2G-PRS] block for a
            Yellow snapshot and limiting top concerns.
        - kind: test_function
          name: generatePrsCommitMarker redacts secret-looking evidence
          description: |
            Planned behavioral test proving marker output never includes raw
            env values or secret fixture strings.
        - kind: test_function
          name: appendPrsCommitMarker does not duplicate an existing marker
          description: |
            Planned behavioral test covering repeated append attempts against a
            custom commit body.
        - kind: test_function
          name: parsePrsCommitMarkers returns history records for valid markers only
          description: |
            Planned behavioral test with valid, absent, malformed, and duplicate
            marker blocks in fixture commit history.
        - kind: test_function
          name: marker inclusion is controlled by user settings
          description: |
            Planned integration test for the selected settings and commit-body
            adapter once promotion chooses the owning module.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/drafts/08-b2g-prs-readiness-composer.manifest.yaml
    - manifests/drafts/09-b2g-prs-report-generators.manifest.yaml
    - manifests/drafts/13-b2g-prs-history-baseline-engine.manifest.yaml
    - src/background/BackgroundService.ts
    - src/services/FileService.ts
    - src/services/interfaces/IFileService.ts
    - src/services/settings.ts
    - src/lib/types.ts
validate:
  - pnpm exec vitest run src/lib/prs/__tests__/commitMarkers.test.ts src/services/__tests__/settings.test.ts
  - ./scripts/maid validate manifests/14-b2g-prs-commit-marker-integration.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check

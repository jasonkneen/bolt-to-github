# draft-kind: hardening-plan
schema: '2'
goal: 'Repair E2E error-flow coverage'
description: |
  Make the browser-level error handling suite deterministic against the current popup UI
  so invalid authentication, offline, repository validation, failed push, retry, and
  recovery scenarios reach meaningful product assertions.
type: fix
files:
  edit:
    - path: e2e/errors.spec.ts
      artifacts:
        - kind: test_function
          name: should show error for invalid GitHub token
        - kind: test_function
          name: should handle network timeout gracefully
        - kind: test_function
          name: should show error for invalid repository name
        - kind: test_function
          name: should show error for empty repository name
        - kind: test_function
          name: should validate repository name format
        - kind: test_function
          name: should show error when push fails
        - kind: test_function
          name: should allow retry after failed push
    - path: e2e/helpers/popup.ts
      artifacts:
        - kind: function
          name: fillRepositorySettings
        - kind: function
          name: clickPushButton
        - kind: function
          name: getValidationError
  read:
    - e2e/fixtures/extension.ts
    - e2e/helpers/storage.ts
    - src/popup/App.svelte
    - src/lib/components/RepoSettings.svelte
    - src/lib/components/ProjectsList.svelte
validate:
  - pnpm exec playwright test e2e/errors.spec.ts --project=chromium --reporter=list
  - pnpm exec playwright test --project=chromium --reporter=list

# draft-kind: hardening-plan
schema: '2'
goal: 'Replace native LogViewer confirmations'
description: |
  Replace LogViewer's native confirm dialogs with application-native confirmation UI for
  normal and emergency log clearing, preserving destructive-action safeguards and visible
  loading states.
type: fix
files:
  create:
    - path: src/lib/components/__tests__/LogViewer.component.test.ts
      artifacts:
        - kind: test_function
          name: canceling the clear logs dialog leaves logs intact
          description: Required new behavioral test before promotion.
        - kind: test_function
          name: confirming clear logs clears logs and reloads visible entries
          description: Required new behavioral test before promotion.
        - kind: test_function
          name: confirming emergency clear shows loading and clears emergency logs
          description: Required new behavioral test before promotion.
  edit:
    - path: src/lib/components/LogViewer.svelte
      artifacts:
        - kind: function
          name: LogViewer
        - kind: function
          name: handleClearLogs
        - kind: function
          name: handleClearLogsEmergency
    - path: src/lib/components/__tests__/LogViewer.logic.test.ts
      artifacts:
        - kind: test_function
          name: log viewer does not depend on native confirm dialogs
          description: Required new behavioral test before promotion.
  read:
    - src/lib/components/ui/dialog/ConfirmationDialog.svelte
    - src/lib/components/ui/dialog/EnhancedConfirmationDialog.svelte
    - src/lib/utils/logger.ts
    - src/lib/utils/logStorage.ts
validate:
  - pnpm exec vitest run src/lib/components/__tests__/LogViewer.logic.test.ts src/lib/components/__tests__/LogViewer.component.test.ts
  - '! rg -n "alert\\(|confirm\\(|prompt\\(" src/lib src/popup src/content --glob "!**/__tests__/**" --glob "!**/test-fixtures/**" --glob "!**/*.test.ts"'
  - pnpm lint
  - pnpm check
created: '2026-05-30T20:41:28+08:00'

# draft-kind: implementation-plan (retention-conversion-plan Workstream C2)
schema: '2'
goal: Show free users a quiet, dismissible "see what changed in this push (Pro)" teaser at the post-push success moment, frequency-capped and fully measurable.
description: |
  The successful-push confirmation is the highest-goodwill moment in the
  product, but free users get no discovery of the file-changes Pro feature
  there. retention-conversion-plan Workstream C2 calls for a dismissible
  teaser at that moment instead of interruptive modals. UIManager already
  reacts to uploadStatus success (it resets the push reminder state there),
  which is the natural call-site seam.

  Rationale for design choices:
  - Sprout a dedicated PostPushTeaserService instead of growing UIManager:
    the show/suppress policy (premium status, dismissal, frequency cap)
    becomes pure decision logic testable with fakes, and UIManager only
    gains a one-line call at its existing success branch (call-site rewire,
    uncontracted read).
  - All hidden inputs are injected per repo testability rules: premium
    status lookup, notification display, storage, and clock arrive as
    constructor collaborators, so tests use an in-memory storage fake and a
    fixed clock, no mocking of chrome globals inside policy logic.
  - The teaser renders through the existing
    NotificationManager.showUpgradeNotification surface (dismissible, with
    an upgrade action) — no new UI primitives. The upgrade URL carries
    utm_source=extension&utm_medium=content&utm_campaign=upgrade&
    utm_content=post_push_teaser, and impressions/clicks are recorded via
    the trackUpgradeFunnelEvent helper contracted in the
    01-instrument-upgrade-funnel-events draft (context post_push_teaser), so
    this surface lands in the same C1 baseline.
  - Suppression policy: never for premium users, never after the user picks
    "don't show again" (persisted flag), and at most once per 7 days
    otherwise. Sequencing note from the plan: promote this draft only after
    the C1 instrumentation baseline exists; the teaser's copy and frequency
    cap are expected to be tuned against that data.

  Depends on: 01-instrument-upgrade-funnel-events draft (trackUpgradeFunnelEvent).
type: feature
files:
  create:
    - path: src/content/services/PostPushTeaserService.ts
      artifacts:
        - kind: interface
          name: PostPushTeaserDeps
          description: Injected collaborators so the teaser policy is testable without chrome globals.
        - kind: attribute
          name: isPremium
          of: PostPushTeaserDeps
          type: '() => Promise<boolean>'
          description: Resolves the current premium status (backed by PremiumService in production).
        - kind: attribute
          name: showTeaser
          of: PostPushTeaserDeps
          type: '(options: { message: string; upgradeUrl: string; onDismissForever: () => void }) => void'
          description: Displays the dismissible teaser (backed by NotificationManager.showUpgradeNotification in production).
        - kind: attribute
          name: storage
          of: PostPushTeaserDeps
          type: '{ get: (keys: string[]) => Promise<Record<string, unknown>>; set: (items: Record<string, unknown>) => Promise<void> }'
          description: Persistence seam for the dismissed-forever flag and last-shown timestamp (chrome.storage.local in production).
        - kind: attribute
          name: now
          of: PostPushTeaserDeps
          type: '() => number'
          description: Injected clock for the frequency cap; tests use fixed timestamps.
        - kind: class
          name: PostPushTeaserService
          description: |
            Owns the post-push teaser policy. Constructor only assigns the
            injected deps (no I/O). The UTM-tagged upgrade URL uses
            utm_content=post_push_teaser; impressions and upgrade clicks are
            reported through trackUpgradeFunnelEvent with context
            post_push_teaser.
        - kind: method
          name: maybeShowTeaser
          of: PostPushTeaserService
          args: []
          returns: Promise<boolean>
          description: |
            Called after a successful push. Returns true and shows the
            teaser only when the user is authenticated non-premium, has not
            dismissed forever, and the last-shown timestamp is more than 7
            days old (or absent); persists the new timestamp when shown.
            Returns false otherwise and on any dependency failure — the
            teaser must never surface an error into the push success flow.
    - path: src/content/services/__tests__/PostPushTeaserService.test.ts
      artifacts:
        - kind: test_function
          name: shows the teaser to a free user who has never seen it and persists the shown timestamp
        - kind: test_function
          name: never shows the teaser to a premium user
        - kind: test_function
          name: honors the dismissed-forever flag across calls
        - kind: test_function
          name: suppresses the teaser within the 7-day frequency window and shows again after it
        - kind: test_function
          name: returns false without throwing when premium lookup or storage fails
        - kind: test_function
          name: teaser upgrade URL carries post_push_teaser UTM attribution
  read:
    - src/content/UIManager.ts
    - src/content/managers/NotificationManager.ts
    - src/content/services/PremiumService.ts
    - src/lib/utils/analytics.ts
    - src/lib/utils/upgradeModal.ts
validate:
  - pnpm exec vitest run src/content/services/__tests__/PostPushTeaserService.test.ts
  - pnpm lint
  - pnpm check
created: '2026-07-04T20:15:00Z'
metadata:
  tags:
    - conversion
    - premium
    - content-ui
    - retention-plan-c2
  priority: medium
  status: planning
temptations:
  - risk: Do not call chrome.storage, Date.now, or PremiumService.getInstance directly inside the policy logic.
    instead: Inject storage, clock, and premium lookup through PostPushTeaserDeps and wire real implementations only at the UIManager composition point.
  - risk: Do not let a teaser failure (storage error, notification error) break or delay the push success path.
    instead: Catch everything inside maybeShowTeaser and return false; the success flow proceeds identically whether the teaser shows or not.
  - risk: Do not grow UIManager with inline teaser policy or add another notification primitive.
    instead: One call to maybeShowTeaser at the existing status success branch; rendering reuses showUpgradeNotification.
  - risk: Do not test the frequency cap with real time or sleeps.
    instead: Drive the injected now() with fixed timestamps on both sides of the 7-day boundary.
  - risk: Do not show the teaser to signed-out users or turn it into a repeated nag when data is missing.
    instead: Treat missing or unreadable state as "do not show" except for the genuinely-first-time case (no dismissal flag, no timestamp, confirmed free user).

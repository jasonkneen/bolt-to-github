          type: JSON fixture
          description: Planned golden ReadinessSnapshot proving Red state and redaction.
    - path: test/golden/prs/history-large-export.snapshot.json
      artifacts:
        - kind: type
          name: HistoryLargeExportSnapshotGoldenJson
          type: JSON fixture
          description: Planned golden ReadinessSnapshot for history baseline thresholds.

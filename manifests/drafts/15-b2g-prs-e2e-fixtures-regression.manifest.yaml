temptations:
  - risk: Do not make fixture tests depend on live GitHub API calls, current time, or real user exports.
    instead: Use synthetic project fixtures, fixed timestamps, mocked base trees, and golden output files.
  - risk: Do not only test each detector in isolation and assume the pipeline works.
    instead: Run representative fixtures through inventory, diff, detectors, composer, and reports together.
  - risk: Do not update golden files casually to make a regression pass.
    instead: Treat golden diffs as behavioral changes that require reviewing the parent reference and child manifests.
  - risk: Do not let secret fixture values appear in snapshot JSON, Markdown, logs, or assertion failure messages.
    instead: Use known sentinel secrets and assert their absence from all serialized pipeline outputs.

          name: SecretFilePrsFixtureProject
          type: Project fixture directory
          description: Planned fixture containing secret-looking values that must be redacted.
    - path: test/fixtures/prs/history-large-export/
      artifacts:
        - kind: type
          name: HistoryLargeExportPrsFixtureProject
          type: Project fixture directory
          description: Planned fixture representing unusual export size and hotspot history.
    - path: test/golden/prs/ui-only.snapshot.json
      artifacts:

# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Add end-to-end PRS fixture regression tests that run inventory, diff,
  detectors, composer, and reports together across representative exports.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 18 and
  19.3 Child 15.

  This is planning inventory only. It is not promotion-ready until the upstream
  PRS domain, inventory, GitHub base, diff, detector, composer, and report
  drafts provide implementation artifacts and shared fixtures. Promotion should
  choose whether these are Vitest integration tests, Playwright extension tests,
  or a split where pure pipeline fixtures run in Vitest and UI rendering stays
  in Playwright.

  Rationale:
  - The parent epic needs fixture-level confidence that independently tested
    PRS layers compose into stable outputs.
  - This child owns four end-to-end representative fixtures. The broader
    15-fixture strategy from the reference document remains covered by
    detector-level children unless a later promotion deliberately expands this
    E2E slice.
  - Golden JSON and Markdown fixtures should make regressions visible without
    depending on live GitHub, network calls, user projects, or wall-clock time.
  - E2E fixture tests should prove privacy boundaries across the full pipeline,
    especially that secret fixture values are absent from snapshots, receipts,
    handoff reports, and optional marker output.
type: feature
files:
  create:
    - path: src/lib/prs/__tests__/prsPipeline.fixtures.test.ts
      artifacts:
        - kind: test_function
          name: ui only export fixture returns Green snapshot and matching receipt
          description: |
            Planned end-to-end fixture test running candidate inventory, base
            inventory, diff, detectors, composer, and receipt generation for the
            UI-only project fixture.
        - kind: test_function
          name: auth env change fixture returns Yellow or Red with env limitations
          description: |
            Planned end-to-end fixture test proving auth and env changes produce
            the expected readiness state, top concerns, and limitations.
        - kind: test_function
          name: secret file fixture returns Red and redacts every output
          description: |
            Planned end-to-end fixture test asserting raw secret strings are
            absent from snapshot JSON, receipt Markdown, and handoff Markdown.
        - kind: test_function
          name: history large export fixture applies baseline thresholds
          description: |
            Planned end-to-end fixture test proving large historical exports
            produce Yellow or Red based on category combinations, not size alone.
    - path: test/fixtures/prs/ui-only/
      artifacts:
        - kind: type
          name: UiOnlyPrsFixtureProject
          type: Project fixture directory
          description: Planned minimal fixture representing UI-only changes with no sensitive signals.
    - path: test/fixtures/prs/auth-env-change/
      artifacts:
        - kind: type
          name: AuthEnvChangePrsFixtureProject

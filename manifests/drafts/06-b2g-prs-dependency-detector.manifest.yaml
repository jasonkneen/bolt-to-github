# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Detect dependency additions, removals, version changes, package manager
  conflicts, and production-sensitive dependency category introductions for the
  Production Readiness Snapshot module.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.3, 12,
  13, and 19.3 Child 6.

  This draft is planning inventory only. It is not promotion-ready until the
  upstream PRS domain model, inventory, and diff contracts exist; fixture-backed
  behavioral tests are created; the red phase is confirmed where applicable;
  and behavioral MAID validation passes after promotion.

  Rationale:
  - Keep dependency category rules data-driven so Stripe, Resend, Supabase,
    auth, database, AI, monitoring, validation, and related package families
    can be extended without scattering detector logic.
  - Compare candidate and base package manifests rather than inferring changes
    from lockfiles alone.
  - Treat manifest/lockfile mismatches and multiple lockfiles as readiness
    signals, not proof of a broken install.
type: feature
files:
  create:
    - path: src/production-readiness/detectors/dependencyDetector.ts
      artifacts:
        - kind: function
          name: detectDependencySignals
          args:
            - name: input
              type: DependencyDetectorInput
          returns: ReadinessSignal[]
          description: |
            Compares candidate and base package metadata, reports added,
            removed, version-changed, categorized, package-manager-conflict,
            and manifest/lockfile mismatch signals with deterministic evidence.
        - kind: interface
          name: DependencyDetectorInput
          description: Candidate/base package manifests, inventory metadata,
            and PRS comparison summary required by the dependency detector.
        - kind: attribute
          of: DependencyDetectorInput
          name: candidatePackageJson
          type: PackageManifest | null
        - kind: attribute
          of: DependencyDetectorInput
          name: basePackageJson
          type: PackageManifest | null
        - kind: attribute
          of: DependencyDetectorInput
          name: candidateLockfiles
          type: string[]
        - kind: attribute
          of: DependencyDetectorInput
          name: baseLockfiles
          type: string[]
    - path: src/production-readiness/rules/dependency-categories.ts
      artifacts:
        - kind: type
          name: DependencyCategory
          type: "'auth' | 'database' | 'payments' | 'email_sms' | 'ai_api' | 'validation' | 'monitoring' | 'platform_storage'"
          description: Production-sensitive dependency categories called out by
            the PRS reference document.
        - kind: function
          name: categorizeDependency
          args:
            - name: packageName
              type: string
          returns: DependencyCategory | null
          description: Maps exact package names and scoped package patterns to
            production-sensitive dependency categories.
    - path: src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
      artifacts:
        - kind: test_function
          name: detects dependency additions removals and version changes from package json diffs
          description: Planned fixture test for dependencies, devDependencies,
            peerDependencies, and optionalDependencies.
        - kind: test_function
          name: categorizes production sensitive dependency introductions
          description: Planned fixture test for Stripe, Resend, Supabase, auth,
            database, AI, monitoring, and validation package signals.
        - kind: test_function
          name: reports manifest and lockfile mismatch signals
          description: Planned fixture test for package.json changes without
            lockfile changes, lockfile changes without manifest changes, and
            multiple package-manager lockfiles.
  read:
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - docs/b2g_production_readiness_snapshot_reference.md
    - src/production-readiness/domain.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/inventory/zipInventory.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
  - ./scripts/maid validate manifests/06-b2g-prs-dependency-detector.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
created: '2026-07-07T12:56:39+08:00'
metadata:
  parent_epic: b2g-production-readiness-snapshot
  child_slug: 06-b2g-prs-dependency-detector
  tags:
    - production-readiness
    - dependencies
    - deterministic-analysis
    - planning-inventory
  priority: high
  status: planning
  promotable: false
  source_document: docs/b2g_production_readiness_snapshot_reference.md
  planned_validation:
    - pnpm exec vitest run src/production-readiness/detectors/__tests__/dependencyDetector.test.ts
    - ./scripts/maid validate manifests/06-b2g-prs-dependency-detector.manifest.yaml --mode behavioral
  promotion_blockers:
    - Upstream PRS domain and inventory artifacts are not declared in this child.
    - Planned behavioral tests do not exist yet.
    - Red phase has not been confirmed.
temptations:
  - risk: Do not hardcode every dependency name inside detector control flow.
    instead: Keep package family matching in dependency-categories rules and test
      category mapping independently from signal composition.
  - risk: Do not treat a new dependency as a vulnerability finding.
    instead: Emit an evidence-backed readiness signal that asks the user to
      review the introduced production-sensitive category.
  - risk: Do not infer dependency drift from lockfiles when package manifests
      are unavailable.
    instead: Report the missing or mismatched data as a limitation or
      manifest/lockfile consistency signal.
  - risk: Do not ignore lockfiles through broad source-ignore rules.
    instead: Preserve lockfile metadata for dependency analysis even when the
      files are skipped for expensive source scanning.

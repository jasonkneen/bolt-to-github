# draft-kind: auth-lifecycle-fix (3 of 8)
schema: '2'
goal: 'Transient re-auth clears only session tokens, never GitHub App config'
type: fix
description: |
  Root cause: triggerReAuthentication() calls the full logout() path, whose
  notifyLogout() -> clearGitHubAppsCache() removes authenticationMethod and all
  githubApp* keys from storage. A transient Supabase session expiry therefore
  destroys the GitHub App linkage; initializeGitHubService() then defaults the
  missing authenticationMethod to 'pat', finds no PAT, and leaves githubService
  null — so pushes keep failing even after Supabase auth is restored.

  Fix contract: introduce a public clearExpiredSession() on SupabaseAuthService
  that clears ONLY the Supabase session artifacts (supabaseToken,
  supabaseRefreshToken, supabaseTokenExpiry, supabaseAuthState,
  refreshTokenIssuedAt, extensionSessionMinted, extensionSessionMintedAt) and
  resets in-memory auth state. triggerReAuthentication() and the session-expiry
  paths use clearExpiredSession(); the explicit user-initiated logout() keeps
  its current full-wipe behavior including GitHub App cache.

  Rationale: the GitHub App installation belongs to the user's GitHub account,
  not to the Supabase session lifecycle. Re-authenticating the Supabase session
  must be able to resume using the still-valid GitHub App linkage. The PAT
  fallback default in initializeGitHubService is intentionally untouched here
  (PAT removal is a separate future effort).
temptations:
  - risk: 'Do not "simplify" by making logout() itself soft — explicit user logout MUST still wipe GitHub App cache (account switching depends on it).'
    instead: 'Keep two distinct public behaviors: logout() = full wipe, clearExpiredSession() = session-only; test both storage outcomes explicitly.'
  - risk: 'Do not enumerate the session key list in multiple places again (the bug class that caused extensionSessionMinted to be missed in early cleanup paths).'
    instead: 'Route every session-only cleanup through clearExpiredSession() and assert via tests that githubApp* keys survive it.'
files:
  edit:
    - path: src/content/services/SupabaseAuthService.ts
      artifacts:
        - kind: method
          name: clearExpiredSession
          of: SupabaseAuthService
          args: []
          returns: Promise<void>
          description: |
            Clears only Supabase session storage keys and resets in-memory auth
            state to unauthenticated; leaves authenticationMethod and all
            githubApp* storage keys intact. Used by triggerReAuthentication and
            session-invalidation paths in place of full logout().
    - path: src/content/services/__tests__/SupabaseAuthService.session-cleanup.test.ts
      artifacts:
        - kind: test_function
          name: clearExpiredSession removes supabase session keys and minted flags
        - kind: test_function
          name: clearExpiredSession preserves authenticationMethod and githubApp keys
        - kind: test_function
          name: re-authentication flow after session expiry keeps GitHub App linkage usable
        - kind: test_function
          name: explicit logout still clears GitHub App cache and authenticationMethod
  read:
    - src/services/GitHubAppService.ts
    - src/background/BackgroundService.ts
    - src/content/services/__tests__/SupabaseAuthService.independent-session.test.ts
validate:
  - pnpm exec vitest run src/content/services/__tests__/SupabaseAuthService.session-cleanup.test.ts src/content/services/__tests__/SupabaseAuthService.independent-session.test.ts
  - pnpm lint
  - pnpm check

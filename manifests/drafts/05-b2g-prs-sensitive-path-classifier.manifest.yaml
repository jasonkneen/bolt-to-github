# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Classify changed files into PRS readiness categories using deterministic,
  data-driven sensitive path rules.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic. This is
  planning inventory only and is not promotion-ready until classifier fixtures
  and behavioral tests exist, red phase is confirmed, and behavioral MAID
  validation passes after promotion.

  This slice owns deterministic path-based classification for changed files. It
  should convert diff entries into category evidence for identity/access,
  data/persistence, secrets/config, deployment/ops, external integrations,
  public surface, testing/recovery, and maintainability signals. It must not
  perform env secret scanning, dependency diffing, readiness composition, UI, or
  report generation.
temptations:
  - risk: 'Do not scatter sensitive path regexes across detector code.'
    instead: 'Store rules in a data-driven path-rules module and test categories through public classifier behavior.'
  - risk: 'Do not let broad ignore rules hide lockfiles, config files, routes, or deployment metadata.'
    instead: 'Classify from normalized diff entries and explicitly test retained metadata paths.'
  - risk: 'Do not emit vague category signals without file evidence.'
    instead: 'Return category evidence with the matched path, rule, and readiness category.'
type: feature
files:
  create:
    - path: src/production-readiness/rules/path-rules.ts
      artifacts:
        - kind: interface
          name: SensitivePathRule
          description: Planned data-driven rule with category, glob or regex pattern, severity hint, and explanation.
        - kind: function
          name: getSensitivePathRules
          args: []
          returns: SensitivePathRule[]
          description: Planned source of initial PRS sensitive path rules from the reference document.
    - path: src/production-readiness/detectors/sensitivePathClassifier.ts
      artifacts:
        - kind: interface
          name: SensitivePathClassification
          description: Planned category, path, matched rule, and evidence object for a classified changed file.
        - kind: function
          name: classifySensitivePaths
          args:
            - name: diff
              type: InventoryDiffResult
            - name: rules
              type: SensitivePathRule[] | undefined
          returns: SensitivePathClassification[]
          description: Planned pure classifier that maps changed files to PRS readiness categories and evidence.
    - path: src/production-readiness/__tests__/sensitive-path-classifier.test.ts
      artifacts:
        - kind: test_function
          name: auth data config deployment integration route and test paths classify correctly
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: ignore rules do not hide lockfiles or relevant config
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: classifier evidence includes category and path
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/sensitive-paths.ts
      artifacts:
        - kind: function
          name: createSensitivePathFixture
          args:
            - name: name
              type: string
          returns: SensitivePathFixture
          description: Planned deterministic changed-file fixture factory for path classifier tests.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/drafts/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/drafts/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - manifests/drafts/04-b2g-prs-diff-engine.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/rules/ignore-rules.ts
validate:
  - pnpm exec vitest run src/production-readiness/__tests__/sensitive-path-classifier.test.ts
  - ./scripts/maid validate manifests/05-b2g-prs-sensitive-path-classifier.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
created: '2026-07-07T12:56:53+08:00'
metadata:
  tags:
    - production-readiness
    - sensitive-paths
    - classifier
    - deterministic-analysis
  priority: high
  status: planning
  promotable: false
  parent_epic: b2g-production-readiness-snapshot
  depends_on:
    - 01-b2g-prs-domain-models-fixtures
    - 02-b2g-prs-zip-inventory-normalization
    - 04-b2g-prs-diff-engine
  source_document: docs/b2g_production_readiness_snapshot_reference.md

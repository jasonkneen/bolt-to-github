# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Fetch and normalize GitHub repository base tree and file metadata for PRS
  comparison against the candidate Bolt zip inventory.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic. This is
  planning inventory only and is not promotion-ready until mocked GitHub
  fixtures and behavioral tests exist, red phase is confirmed, and behavioral
  MAID validation passes after promotion.

  This slice owns read-only base inventory collection from GitHub. It should
  preserve repository and base-ref metadata, normalize tree entries into the PRS
  inventory shape where practical, and return visible limitations for missing,
  forbidden, rate-limited, or partial GitHub data. It must not push commits,
  create branches, mutate repository state, or hide comparison failures behind
  fake base data.
temptations:
  - risk: 'Do not silently treat failed GitHub reads as an empty base repository.'
    instead: 'Return partial inventory limitations that downstream snapshot composition can display.'
  - risk: 'Do not fetch full blob contents for every repository file by default.'
    instead: 'Use tree metadata first and request file content only when planned downstream behavior requires it.'
  - risk: 'Do not broaden GitHub token permissions for PRS base reads.'
    instead: 'Reuse the existing GitHub service boundaries and keep this adapter read-only.'
type: feature
files:
  create:
    - path: src/production-readiness/inventory/githubBaseInventory.ts
      artifacts:
        - kind: interface
          name: GitHubBaseInventoryRequest
          description: Planned owner, repo, base ref, and cancellation/options request for collecting base inventory.
        - kind: interface
          name: GitHubBaseInventoryResult
          description: Planned normalized base inventory with base ref summary, repository ref, and limitations.
        - kind: function
          name: buildGitHubBaseInventory
          args:
            - name: request
              type: GitHubBaseInventoryRequest
          returns: Promise<GitHubBaseInventoryResult>
          description: Planned read-only adapter that converts GitHub tree data into PRS base inventory metadata.
    - path: src/production-readiness/__tests__/github-base-inventory.test.ts
      artifacts:
        - kind: test_function
          name: mock GitHub tree data normalizes into base inventory
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: missing GitHub data produces a partial snapshot limitation
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: rate limited GitHub data produces a partial snapshot limitation
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: base ref metadata is preserved
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/github-base.ts
      artifacts:
        - kind: function
          name: createGitHubTreeFixture
          args:
            - name: name
              type: string
          returns: GitHubTreeFixture
          description: Planned deterministic factory for mocked GitHub tree and error fixtures.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/drafts/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/drafts/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - src/production-readiness/inventory/zipInventory.ts
    - src/services
    - src/lib/services
validate:
  - pnpm exec vitest run src/production-readiness/__tests__/github-base-inventory.test.ts
  - ./scripts/maid validate manifests/03-b2g-prs-github-base-inventory.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check

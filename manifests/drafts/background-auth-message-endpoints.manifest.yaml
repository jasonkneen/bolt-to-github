# draft-kind: auth-lifecycle-refactor (5 of 8)
schema: '2'
goal: 'Expose background auth operations as runtime message endpoints'
type: feature
description: |
  Foundation for the single-auth-authority architecture (drafts 6 and 7).
  Today SupabaseAuthService.getInstance() is instantiated in three JS contexts
  (background service worker, popup, every bolt.new content script). Each copy
  independently refreshes the SAME stored Supabase refresh token; Supabase
  refresh-token rotation with reuse detection then revokes the whole session
  family — a standing cause of spontaneous auth loss. The popup copy can also
  "fix" storage without the background ever finding out.

  Fix contract: a new AuthMessageRouter module in the background handles a
  typed set of auth runtime messages so other contexts can query and drive the
  ONE background auth service instead of running their own:
    GET_AUTH_STATE, FORCE_AUTH_CHECK, ENTER_POST_CONNECTION_MODE,
    SYNC_GITHUB_APP, VALIDATE_SUBSCRIPTION, AUTH_LOGOUT.
  BackgroundService routes these message types to the router from its existing
  chrome.runtime.onMessage listener, returning literal true synchronously for
  async branches (per the mv3-runtime-messaging Outcome lesson from
  harden-background-runtime-message-channel).

  Rationale: a separate small module (rather than growing the 2000-line
  BackgroundService) keeps the auth message surface independently testable
  with the real SupabaseAuthService behavior behind it.
temptations:
  - risk: 'Do not register the router as a second chrome.runtime.onMessage listener — two listeners racing for sendResponse is the exact MV3 bug class fixed in harden-background-runtime-message-channel.'
    instead: 'Route from the existing BackgroundService listener into router.handleMessage and return its boolean synchronously.'
  - risk: 'Do not return an async function from the listener path or forget the literal true for async branches.'
    instead: 'handleMessage returns boolean synchronously; tests must capture the immediate return value (see regression-coverage Outcome lesson).'
  - risk: 'Do not mock SupabaseAuthService method-by-method into a hollow interaction test.'
    instead: 'Use a fake auth service implementing the small surface the router needs; assert on the response payloads delivered through sendResponse.'
files:
  edit:
    - path: src/background/AuthMessageRouter.ts
      artifacts:
        - kind: type
          name: AuthMessageType
          type: "'GET_AUTH_STATE' | 'FORCE_AUTH_CHECK' | 'ENTER_POST_CONNECTION_MODE' | 'SYNC_GITHUB_APP' | 'VALIDATE_SUBSCRIPTION' | 'AUTH_LOGOUT'"
        - kind: interface
          name: AuthMessageResponse
        - kind: attribute
          name: success
          of: AuthMessageResponse
          type: boolean
        - kind: attribute
          name: authState
          of: AuthMessageResponse
          type: AuthState | undefined
        - kind: attribute
          name: result
          of: AuthMessageResponse
          type: boolean | undefined
        - kind: attribute
          name: error
          of: AuthMessageResponse
          type: string | undefined
        - kind: class
          name: AuthMessageRouter
          description: |
            Constructed with the background SupabaseAuthService instance;
            stateless otherwise (no I/O in constructor).
        - kind: method
          name: handleMessage
          of: AuthMessageRouter
          args:
            - name: message
              type: '{ type: AuthMessageType }'
            - name: sendResponse
              type: '(response: AuthMessageResponse) => void'
          returns: boolean
          description: |
            Returns literal true synchronously when it will respond
            asynchronously, false for message types it does not handle.
            Failures are surfaced through sendResponse({success:false,error}),
            never swallowed (fail-loud policy).
    - path: src/background/BackgroundService.ts
      artifacts:
        - kind: class
          name: BackgroundService
          description: |
            The existing runtime message listener delegates auth message types
            to AuthMessageRouter.handleMessage and propagates its synchronous
            boolean return; all other message handling is unchanged.
    - path: src/background/__tests__/AuthMessageRouter.test.ts
      artifacts:
        - kind: test_function
          name: GET_AUTH_STATE responds with the background auth state
        - kind: test_function
          name: FORCE_AUTH_CHECK triggers a check and responds success
        - kind: test_function
          name: SYNC_GITHUB_APP responds with the sync result
        - kind: test_function
          name: VALIDATE_SUBSCRIPTION responds with the validation result
        - kind: test_function
          name: AUTH_LOGOUT performs full logout and responds success
        - kind: test_function
          name: handleMessage returns literal true synchronously for handled async messages
        - kind: test_function
          name: handleMessage returns false for unrelated message types
        - kind: test_function
          name: auth service failures surface as error responses instead of silence
  read:
    - src/content/services/SupabaseAuthService.ts
    - src/background/__tests__/BackgroundService.reload.test.ts
    - manifests/harden-background-runtime-message-channel.manifest.yaml
validate:
  - pnpm exec vitest run src/background/__tests__/AuthMessageRouter.test.ts src/background/__tests__/BackgroundService.reload.test.ts
  - pnpm lint
  - pnpm check
created: '2026-07-04T09:08:41+08:00'
metadata:
  tags:
    - auth
    - mv3
    - messaging
    - architecture
  priority: high
  status: planning
  depends_on: []
  promotion_ready: false
  notes: |
    Behavioral tests planned, red phase not confirmed. Drafts 6 and 7 depend on
    this message surface. AuthState is imported from SupabaseAuthService.

# draft-kind: hardening-plan
schema: '2'
goal: 'Harden background runtime message responses for MV3'
description: |
  Convert BackgroundService runtime message handling so asynchronous branches keep the
  Chrome response channel open by returning literal true synchronously, while preserving
  current behavior for direct and helper-handled message types.
type: fix
files:
  edit:
    - path: src/background/BackgroundService.ts
      artifacts:
        - kind: class
          name: BackgroundService
          description: |
            Runtime message listener registration must return literal true synchronously
            for async response branches and surface async failures through sendResponse.
    - path: src/background/__tests__/BackgroundService.reload.test.ts
      artifacts:
        - kind: test_function
          name: should respond successfully when reload request is processed
          description: |
            Existing reload coverage to extend with a synchronous return-value assertion
            before this draft is promoted.
        - kind: test_function
          name: should handle reload request gracefully when alarm creation fails
          description: |
            Existing async failure-path coverage to extend with sendResponse channel
            preservation before this draft is promoted.
        - kind: test_function
          name: runtime listener returns literal true synchronously for async response branches
          description: Required new behavioral test before promotion.
        - kind: test_function
          name: runtime listener sends failure response when async branch rejects
          description: Required new behavioral test before promotion.
  read:
    - src/background/__tests__/BackgroundService.alarms.test.ts
    - src/background/__tests__/BackgroundService.auth-lifecycle.test.ts
    - src/background/test-fixtures/BackgroundServiceMocks.ts
validate:
  - pnpm exec vitest run src/background/__tests__/BackgroundService.reload.test.ts
  - pnpm lint
  - pnpm check
  - pnpm test:ci

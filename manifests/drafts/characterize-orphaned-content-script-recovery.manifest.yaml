# draft-kind: auth-lifecycle-hardening (8 of 8)
schema: '2'
goal: 'Characterize and harden orphaned content-script recovery on bolt.new'
type: fix
description: |
  When the extension reloads (self-heal from draft 1, update, or manual
  toggle), content scripts on open bolt.new tabs are orphaned ("extension
  context invalidated") and the injected UI dies — the reason the manual
  recovery ritual includes refreshing bolt.new. ContentManager already contains
  recovery logic (reconnect attempts, handleUnrecoverableContextInvalidation,
  a fallback banner), but it has no behavioral test coverage, so we cannot
  trust it fires in the self-heal path that draft 1 makes real.

  Fix contract (characterize first, then close gaps found):
  - Characterization tests pin the existing recovery ladder: service-worker
    disconnect -> reconnect attempts -> unrecoverable invalidation -> a
    persistent, non-intrusive "refresh this page to reconnect" banner that
    never auto-refreshes the tab (user decision: banner, not auto-reload,
    to protect in-progress bolt.new work).
  - The banner path must trigger when chrome.runtime.id disappears, including
    when UIManager is unavailable (fallback DOM banner).
  - Gaps discovered while characterizing (e.g. banner missing after the
    SHOW_EXTENSION_RELOAD_NOTIFICATION countdown, recovery flag stuck) are
    fixed within ContentManager only; anything larger becomes a new manifest.

  Rationale: this is legacy code under Feathers' rules — pin current behavior
  before changing it. The draft is explicitly characterization-first; its red
  phase applies only to the gap fixes, not the pinned behavior.
temptations:
  - risk: 'Do not rewrite the recovery ladder while adding tests — mixing structural and behavioral changes in untested legacy code.'
    instead: 'Land characterization tests green against current behavior first; make gap fixes as separate minimal commits inside this manifest scope.'
  - risk: 'Do not assert on private recovery flags (isInRecovery, reconnectAttempts).'
    instead: 'Assert observable outcomes: banner element present in the DOM, port reconnection attempted, no automatic location.reload of the tab.'
files:
  edit:
    - path: src/content/ContentManager.ts
      artifacts:
        - kind: class
          name: ContentManager
          description: |
            Recovery behavior contract: on unrecoverable context invalidation
            a persistent refresh-prompt banner is shown (via UIManager when
            alive, fallback DOM node otherwise) and the tab is never reloaded
            automatically. Only gap fixes to honor this contract are in scope;
            the recovery ladder structure is preserved.
    - path: src/content/__tests__/ContentManager.orphan-recovery.test.ts
      artifacts:
        - kind: test_function
          name: unrecoverable context invalidation shows a persistent refresh banner
        - kind: test_function
          name: fallback banner appears when UIManager is unavailable
        - kind: test_function
          name: recovery never reloads the bolt.new tab automatically
        - kind: test_function
          name: service worker restart with valid runtime reconnects without banner
        - kind: test_function
          name: extension reload notification precedes orphaning during self-heal
  read:
    - src/content/UIManager.ts
    - src/content/MessageHandler.ts
    - src/background/BackgroundService.ts
validate:
  - pnpm exec vitest run src/content/__tests__/ContentManager.orphan-recovery.test.ts
  - pnpm lint
  - pnpm check
created: '2026-07-04T09:08:41+08:00'

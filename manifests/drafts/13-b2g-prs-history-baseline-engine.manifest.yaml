# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Analyze GitHub commit history or prior B2G snapshots to detect unusual change
  size, hotspots, dependency drift, and repeated sensitive-area churn for the
  Production Readiness Snapshot module.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic, derived
  from docs/b2g_production_readiness_snapshot_reference.md sections 8.1, 8.8,
  9, 11, 12, 17, 18, and 19.3 Child 10.

  This draft is planning inventory only. It is not promotion-ready until the
  upstream PRS domain model and diff contracts exist; fixture-backed behavioral
  tests are created; the red phase is confirmed where applicable; and
  behavioral MAID validation passes after promotion. This child owns the
  minimal history adapter and prior-snapshot store contracts needed by the
  baseline engine; later commit-marker integration can add richer marker
  parsing as an additional history source.

  Rationale:
  - Prefer prior PRS snapshots, then identifiable B2G commits, then recent
    GitHub commit history as a fallback, matching the reference source order.
  - Use robust statistics such as median, percentile rank, and IQR/MAD-style
    unusual-change detection rather than simple averages.
  - Insufficient or unavailable history must produce visible limitations and
    lower confidence, not fabricated trend claims.
type: feature
files:
  create:
    - path: src/production-readiness/history/historyBaselineEngine.ts
      artifacts:
        - kind: function
          name: buildHistoryBaseline
          args:
            - name: input
              type: HistoryBaselineInput
          returns: HistoryBaselineResult
          description: |
            Builds robust historical baselines from prior snapshots,
            identifiable B2G commits, or recent GitHub commits and returns
            unusual-change, hotspot, dependency-drift, and sensitive-churn
            evidence with limitations when history is insufficient.
        - kind: interface
          name: HistoryBaselineInput
          description: Current comparison metrics plus prior snapshot and
            commit-history records used for PRS history analysis.
        - kind: attribute
          of: HistoryBaselineInput
          name: current
          type: ComparisonSummary
        - kind: attribute
          of: HistoryBaselineInput
          name: priorSnapshots
          type: PrsHistorySample[]
        - kind: attribute
          of: HistoryBaselineInput
          name: githubCommits
          type: PrsCommitHistoryRecord[]
        - kind: interface
          name: HistoryBaselineResult
          description: History-derived signals, metrics, labels, hotspots, and
            limitations for the readiness composer.
        - kind: attribute
          of: HistoryBaselineResult
          name: signals
          type: ReadinessSignal[]
        - kind: attribute
          of: HistoryBaselineResult
          name: baseline
          type: PrsHistoryBaseline | null
        - kind: attribute
          of: HistoryBaselineResult
          name: limitations
          type: string[]
        - kind: type
          name: HistoryBaselineLabel
          type: "'normal_range' | 'larger_than_usual' | 'unusually_large' | 'largest_recent_export' | 'repeated_churn' | 'accelerating_dependency_growth' | 'insufficient_history'"
    - path: src/production-readiness/history/historyStats.ts
      artifacts:
        - kind: function
          name: calculateMedian
          args:
            - name: values
              type: number[]
          returns: number | null
          description: Calculates a median baseline for deterministic history
            comparisons and returns null when no samples exist.
        - kind: function
          name: calculatePercentileRank
          args:
            - name: value
              type: number
            - name: samples
              type: number[]
          returns: number | null
          description: Calculates a percentile rank for user-friendly unusual
            change labels.
        - kind: function
          name: detectHistoryHotspots
          args:
            - name: samples
              type: PrsHistorySample[]
          returns: PrsHotspotFile[]
          description: Identifies files repeatedly changed across recent
            snapshots or commits.
    - path: src/production-readiness/github/githubHistoryAdapter.ts
      artifacts:
        - kind: function
          name: fetchPrsCommitHistory
          args:
            - name: request
              type: GitHubHistoryRequest
          returns: Promise<PrsCommitHistoryRecord[]>
          description: |
            Read-only adapter for fetching recent GitHub commit metadata needed
            by the history baseline fallback. It must return empty history plus
            visible limitations on unavailable, forbidden, or rate-limited
            history rather than fabricating samples.
        - kind: interface
          name: GitHubHistoryRequest
          description: Repository owner/name, base ref, optional branch, maximum
            commit count, and cancellation options for read-only history fetches.
        - kind: attribute
          of: GitHubHistoryRequest
          name: owner
          type: string
        - kind: attribute
          of: GitHubHistoryRequest
          name: repo
          type: string
        - kind: attribute
          of: GitHubHistoryRequest
          name: baseRef
          type: string
        - kind: attribute
          of: GitHubHistoryRequest
          name: maxCommits
          type: number
    - path: src/production-readiness/snapshots/priorSnapshotStore.ts
      artifacts:
        - kind: function
          name: loadPriorPrsSnapshots
          args:
            - name: repository
              type: RepositoryRef
          returns: Promise<PrsHistorySample[]>
          description: |
            Loads locally stored prior PRS snapshot summaries for the target
            repository when available. Missing storage or first-export state
            returns an empty sample set and a limitation, not fake history.
        - kind: function
          name: savePrsSnapshotSummary
          args:
            - name: snapshot
              type: ReadinessSnapshot
          returns: Promise<void>
          description: |
            Persists a redaction-safe summary of the current snapshot for later
            local baseline analysis without storing raw source code or secret
            values.
    - path: src/production-readiness/history/__tests__/historyBaselineEngine.test.ts
      artifacts:
        - kind: test_function
          name: calculates median and percentile baselines from fixture history
          description: Planned fixture test for robust baseline metrics.
        - kind: test_function
          name: reports insufficient history as limitations not trend claims
          description: Planned fixture test for fewer than five historical
            samples and unavailable GitHub history.
        - kind: test_function
          name: identifies hotspot files from repeated fixture changes
          description: Planned fixture test for repeated sensitive-area churn
            and source hotspots.
        - kind: test_function
          name: emits large export signals only when thresholds are met
          description: Planned fixture test for documented 3x/6x median and
            fallback thresholds.
  read:
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - docs/b2g_production_readiness_snapshot_reference.md
    - src/production-readiness/domain.ts
    - src/production-readiness/diff/diffEngine.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run src/production-readiness/history/__tests__/historyBaselineEngine.test.ts
  - ./scripts/maid validate manifests/13-b2g-prs-history-baseline-engine.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check

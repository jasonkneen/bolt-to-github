  priority: critical
  status: planning
  depends_on: []
  promotion_ready: false
  notes: |
    Behavioral tests are planned, not yet written; red phase not confirmed.
    Related Outcome lesson (harden-background-runtime-message-channel,
    mv3-runtime-messaging): runtime listeners must return literal true
    synchronously — applies to any listener touched here.

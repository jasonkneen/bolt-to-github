# draft-kind: auth-lifecycle-fix (1 of 8)
schema: '2'
goal: 'Execute auth self-heal reload directly from the background context'
type: fix
description: |
  Root cause: SupabaseAuthService.requestExtensionReload() and the
  OPEN_REAUTHENTICATION trigger use chrome.runtime.sendMessage, but the primary
  SupabaseAuthService instance runs INSIDE the background service worker, and
  Chrome never delivers a runtime message back to its sending context. With no
  other receiver, the self-heal reload (the code equivalent of manually toggling
  the extension) silently never fires, and the guided re-auth tab never opens.
  The reloadRequested flag is then left true, permanently short-circuiting
  triggerReAuthentication() in a service worker that keepAlive keeps alive for
  days. This is the direct mechanism behind "only disabling/enabling the
  extension recovers auth".

  Fix contract:
  - When privileged APIs are available (chrome.alarms for the self-heal alarm,
    chrome.tabs for the re-auth tab), SupabaseAuthService performs the action
    directly instead of messaging itself.
  - When they are not available (content-script context, until the
    single-auth-authority migration in drafts 5-7 removes those instances),
    fall back to the existing runtime message so behavior there is unchanged.
  - reloadRequested must be reset to false whenever the reload is NOT actually
    scheduled (throttled by MIN_TIME_BETWEEN_RELOADS, alarm creation failure,
    message-send failure), so the re-auth flow can retry instead of being
    permanently disabled.

  Rationale: direct execution is chosen over a self-addressed message bus or an
  injected delegate because after drafts 5-7 land, SupabaseAuthService only ever
  runs in the background, where direct execution is always correct; the
  capability fallback is a transitional bridge, not the architecture.
temptations:
  - risk: 'Do not "fix" this by adding a second onMessage listener in the background to catch self-sent messages — Chrome will still not deliver them to the sending context.'
    instead: 'Feature-detect the privileged API (chrome.alarms.create / chrome.tabs.create) and call it directly; keep sendMessage only as the unprivileged-context fallback.'
  - risk: 'Do not leave reloadRequested=true on any early-return path of requestExtensionReload.'
    instead: 'Treat reloadRequested as "a reload is actually scheduled"; reset it on throttle, alarm failure, and message failure, and cover each path with a behavioral test.'
  - risk: 'Do not assert on private fields (reloadRequested, consecutiveAuthFailures) in tests.'
    instead: 'Assert observable behavior: chrome.alarms.create("self-heal-reload", ...) invoked, re-auth modal messages re-sent after a throttled reload, chrome.tabs.create called for the re-auth URL.'
files:
  edit:
    - path: src/content/services/SupabaseAuthService.ts
      artifacts:
        - kind: class
          name: SupabaseAuthService
          description: |
            Self-heal and re-auth triggering become context-aware: after
            MAX_AUTH_FAILURES_BEFORE_RELOAD consecutive failures, the service
            schedules the 'self-heal-reload' alarm directly when chrome.alarms
            is available (falling back to the RELOAD_EXTENSION runtime message
            otherwise), opens the bolt2github.com re-auth tab directly when
            chrome.tabs is available (falling back to OPEN_REAUTHENTICATION),
            and re-enables the re-auth flow whenever a requested reload was not
            actually scheduled. No public API surface changes.
    - path: src/content/services/__tests__/SupabaseAuthService.self-heal-execution.test.ts
      artifacts:
        - kind: test_function
          name: schedules self-heal reload alarm directly after max auth failures in background context
        - kind: test_function
          name: falls back to RELOAD_EXTENSION runtime message when alarms API is unavailable
        - kind: test_function
          name: re-auth flow retries after a throttled reload instead of staying disabled
        - kind: test_function
          name: re-auth flow retries after reload scheduling fails
        - kind: test_function
          name: opens re-authentication tab directly when tabs API is available
  read:
    - src/background/BackgroundService.ts
    - src/content/services/__tests__/SupabaseAuthService.reload.test.ts
    - src/content/services/__tests__/SupabaseAuthService.auth-recovery.test.ts
validate:
  - pnpm exec vitest run src/content/services/__tests__/SupabaseAuthService.self-heal-execution.test.ts src/content/services/__tests__/SupabaseAuthService.reload.test.ts
  - pnpm lint
  - pnpm check
created: '2026-07-04T09:08:41+08:00'
metadata:
  tags:
    - auth

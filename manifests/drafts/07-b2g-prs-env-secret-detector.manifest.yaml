temptations:
  - risk: Do not print, snapshot, log, or preserve secret-looking values for
      easier debugging.
    instead: Store only variable names, file paths, pattern labels, and
      redacted evidence flags in detector output and tests.
  - risk: Do not claim a vulnerability from a regex match.
    instead: Phrase matches as possible secret-looking values unless the
      candidate file is itself a .env-style secret file.
  - risk: Do not limit env scanning to process.env.
    instead: Cover browser and runtime conventions from the reference doc,
      including import.meta.env, Deno.env.get, Bun.env, VITE_*, NEXT_PUBLIC_*,
      and PUBLIC_*.
  - risk: Do not let downstream reports perform first-time redaction.
    instead: Return sanitized evidence from the detector so snapshot, receipt,
      and handoff rendering can only consume redacted values.

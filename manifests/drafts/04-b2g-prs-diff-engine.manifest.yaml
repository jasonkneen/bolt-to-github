# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Compare candidate zip inventory against GitHub base inventory and produce
  deterministic PRS file diff metrics for added, changed, deleted, renamed,
  line-change, and binary-change cases.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic. This is
  planning inventory only and is not promotion-ready until diff fixtures and
  behavioral tests exist, red phase is confirmed, and behavioral MAID
  validation passes after promotion.

  This slice owns inventory-to-inventory comparison. It should consume normalized
  candidate and base inventories, compute deterministic comparison summaries,
  and report limitations for large or binary files that cannot be line-diffed.
  It must not classify paths into readiness categories, compose state, render
  UI, or call GitHub directly.
temptations:
  - risk: 'Do not use raw zip entry names or GitHub tree paths without shared path normalization.'
    instead: 'Compare only normalized inventory entries produced by the inventory slices.'
  - risk: 'Do not count skipped large files as unchanged.'
    instead: 'Represent large-file skips as limitations while still counting file-level changes.'
  - risk: 'Do not infer production sensitivity in the diff engine.'
    instead: 'Emit neutral file and line metrics and let detector slices classify readiness meaning.'
type: feature
files:
  create:
    - path: src/production-readiness/diff/diffEngine.ts
      artifacts:
        - kind: interface
          name: DiffEngineOptions
          description: Planned thresholds for line diffing, rename detection, and large-file limitations.
        - kind: interface
          name: FileDiffEntry
          description: Planned per-file added, changed, deleted, renamed, binary, and skipped-line-diff metadata.
        - kind: interface
          name: InventoryDiffResult
          description: Planned file diff collection, comparison summary, and limitations for downstream detectors.
        - kind: function
          name: compareInventories
          args:
            - name: candidate
              type: FileInventory
            - name: base
              type: FileInventory
            - name: options
              type: DiffEngineOptions | undefined
          returns: InventoryDiffResult
          description: Planned pure comparison function for normalized candidate and base inventories.
    - path: src/production-readiness/__tests__/diff-engine.test.ts
      artifacts:
        - kind: test_function
          name: changed added and deleted counts match fixtures
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: text line deltas are correct
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: large files can be skipped with limitations
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: binary file changes are counted separately
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/diff-cases.ts
      artifacts:
        - kind: function
          name: createInventoryDiffFixture
          args:
            - name: name
              type: string
          returns: InventoryDiffFixture
          description: Planned deterministic candidate/base inventory fixture factory for diff tests.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/drafts/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - manifests/drafts/02-b2g-prs-zip-inventory-normalization.manifest.yaml
    - manifests/drafts/03-b2g-prs-github-base-inventory.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/inventory/zipInventory.ts
    - src/production-readiness/inventory/githubBaseInventory.ts
validate:
  - pnpm exec vitest run src/production-readiness/__tests__/diff-engine.test.ts
  - ./scripts/maid validate manifests/04-b2g-prs-diff-engine.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check

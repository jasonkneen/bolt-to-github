    - Planned behavioral tests do not exist yet.
    - Red phase has not been confirmed.
temptations:
  - risk: Do not run user tests, builds, or linters from inside the browser
      extension.
    instead: Detect readiness signals from package scripts, files, paths, diffs,
      and history metadata only.
  - risk: Do not warn on large files without deterministic thresholds.
    instead: Use the documented PRS thresholds and fixture cases for component
      size, 500+ line yellow, 1000+ line red-when-heavy, and 300+ line growth.
  - risk: Do not treat missing tests as proof that code is broken.
    instead: Emit review-worthy testing_recovery evidence tied to broad source
      changes, deleted tests, or missing scripts.
  - risk: Do not fold deleted tests into generic file deletion counts only.
    instead: Preserve deleted test evidence so the composer can elevate
      testing and recovery concerns.

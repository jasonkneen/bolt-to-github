  parent_epic: b2g-production-readiness-snapshot
  child_slug: 11-b2g-prs-public-surface-detector
  tags:
    - production-readiness
    - public-surface
    - routes
    - api-routes
    - planning-inventory
  priority: high
  status: planning
  promotable: false
  source_document: docs/b2g_production_readiness_snapshot_reference.md
  planned_validation:
    - pnpm exec vitest run src/production-readiness/detectors/__tests__/publicSurfaceDetector.test.ts
    - ./scripts/maid validate manifests/11-b2g-prs-public-surface-detector.manifest.yaml --mode behavioral
  promotion_blockers:

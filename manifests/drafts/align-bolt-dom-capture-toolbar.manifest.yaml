# draft-kind: hardening-plan
schema: '2'
goal: 'Add regression coverage for Bolt DOM capture toolbar extraction'
description: |
  Add regression coverage for the Bolt DOM capture script's current Publish/Share-first
  toolbar extraction and legacy ml-auto fallback so future selector recovery keeps using
  the same strategy as runtime injection. The reusable DOM extraction behavior is
  contracted in a validator-supported JavaScript helper module; the interactive
  .mjs capture script delegates to that helper.
temptations:
  - risk: "Do not declare descriptive .mjs inline blocks as public MAID function artifacts."
    instead: "Expose exact exported helper symbols from scripts/capture-bolt-dom-helpers.js and test those symbols directly."
  - risk: "Do not import script tests from src/** tests to force Vitest collection."
    instead: "Use the shared Vitest script-test harness and run scripts/__tests__/capture-bolt-dom.test.ts directly."
  - risk: "Do not drop the legacy div.ml-auto fallback while extracting helpers."
    instead: "Keep current Publish/Share-first lookup and the legacy ml-auto fallback in extractToolbarHtml."
type: fix
files:
  create:
    - path: scripts/capture-bolt-dom-helpers.js
      artifacts:
        - kind: function
          name: collectStructuredToolbarCandidates
          args:
            - name: documentRef
            - name: url
          description: |
            Collects structured toolbar candidates, including Publish/Share anchors,
            legacy ml-auto containers, gap containers, and existing GitHub buttons.
        - kind: function
          name: extractToolbarHtml
          args:
            - name: documentRef
          description: |
            Extracts toolbar HTML by preferring the current Publish/Share anchored
            toolbar group before falling back to the legacy ml-auto toolbar DOM.
    - path: scripts/__tests__/capture-bolt-dom.test.ts
      artifacts:
        - kind: test_function
          name: extracts toolbar HTML from the current Publish anchored Bolt DOM
          description: Required new behavioral test before promotion.
        - kind: test_function
          name: falls back to legacy ml-auto toolbar DOM
          description: Required new behavioral test before promotion.
        - kind: test_function
          name: records structured toolbar candidates for current and existing GitHub buttons
          description: Required behavioral coverage for structured candidate collection.
  edit:
    - path: src/content/managers/__tests__/GitHubButtonManager.test.ts
      artifacts:
        - kind: test_function
          name: finds the current toolbar group via the Publish button when not under div.ml-auto
        - kind: test_function
          name: finds the legacy container when the toolbar sits under div.ml-auto
  read:
    - scripts/capture-bolt-dom.mjs
    - src/content/managers/GitHubButtonManager.ts
    - bolt-publish-button.html
    - bolt-download-button-v3.html
    - docs/e2e-testing-rules.md
validate:
  - pnpm exec vitest run scripts/__tests__/capture-bolt-dom.test.ts src/content/managers/__tests__/GitHubButtonManager.test.ts
  - pnpm check
  - pnpm lint
  - pnpm build
created: '2026-05-30T20:41:28+08:00'

# draft-kind: child-planning-inventory
schema: '2'
goal: |
  Parse exported Bolt project zips into normalized PRS file inventory with path
  normalization, ignore rules, text/binary detection, size, hash, and line
  counts.
description: |
  Child draft for the b2g-production-readiness-snapshot parent epic. This is
  planning inventory only and is not promotion-ready until the planned zip
  fixtures and behavioral tests exist, red phase is confirmed, and behavioral
  MAID validation passes after promotion.

  This slice owns candidate export inventory only. It should produce normalized
  file metadata for later GitHub comparison, diffing, dependency detection, and
  path classification. It must not fetch GitHub data, compose readiness state,
  render UI, or generate reports.
temptations:
  - risk: 'Do not analyze generated or vendor directories before applying ignore rules.'
    instead: 'Normalize paths first, apply PRS ignore rules, and only then compute expensive text metadata.'
  - risk: 'Do not drop lockfiles with generic generated-file ignores.'
    instead: 'Retain package lockfiles as metadata for dependency analysis even when other generated paths are ignored.'
  - risk: 'Do not line-diff binary or very large files as if they were source text.'
    instead: 'Record binary and large-file metadata and expose limitations for downstream diffing.'
type: feature
files:
  create:
    - path: src/production-readiness/inventory/zipInventory.ts
      artifacts:
        - kind: interface
          name: ZipInventoryOptions
          description: Planned options for ignore rules, binary detection, hash computation, and large-file thresholds.
        - kind: interface
          name: FileInventoryEntry
          description: Planned normalized file metadata for path, size, hash, line count, text/binary state, and analysis eligibility.
        - kind: interface
          name: FileInventory
          description: Planned collection of normalized entries plus inventory limitations.
        - kind: function
          name: buildZipInventory
          args:
            - name: zipData
              type: ArrayBuffer
            - name: options
              type: ZipInventoryOptions | undefined
          returns: Promise<FileInventory>
          description: Planned adapter that reads an exported Bolt zip and returns deterministic PRS inventory metadata.
    - path: src/production-readiness/rules/ignore-rules.ts
      artifacts:
        - kind: type
          name: PrsIgnoreRule
          type: '{ pattern: string; reason: string; retainAsMetadata?: boolean }'
          description: Planned data-driven ignore rule shape for inventory normalization.
        - kind: function
          name: shouldAnalyzePath
          args:
            - name: path
              type: string
          returns: boolean
          description: Planned rule helper that excludes generated/vendor paths while preserving relevant metadata files.
    - path: src/production-readiness/__tests__/zip-inventory-normalization.test.ts
      artifacts:
        - kind: test_function
          name: zip fixture produces expected normalized inventory
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: ignored paths are excluded from source analysis
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: lockfiles remain available for dependency analysis
          description: Required planned behavioral test before promotion.
        - kind: test_function
          name: binary files are counted but not line diffed
          description: Required planned behavioral test before promotion.
    - path: src/production-readiness/test-fixtures/prs/zips/README.md
      artifacts:
        - kind: type
          name: ZipInventoryFixtureCatalog
          type: documentation fixture catalog
          description: Planned catalog describing small synthetic zip fixtures for PRS inventory tests.
  read:
    - docs/b2g_production_readiness_snapshot_reference.md
    - manifests/drafts/b2g-production-readiness-snapshot.manifest.yaml
    - manifests/drafts/01-b2g-prs-domain-models-fixtures.manifest.yaml
    - src/production-readiness/domain.ts
    - src/production-readiness/test-fixtures/prsFixtures.ts
validate:
  - pnpm exec vitest run src/production-readiness/__tests__/zip-inventory-normalization.test.ts
  - ./scripts/maid validate manifests/02-b2g-prs-zip-inventory-normalization.manifest.yaml --mode behavioral
  - pnpm lint
  - pnpm check
created: '2026-07-07T12:56:53+08:00'
metadata:
  tags:
    - production-readiness
    - zip-inventory
    - normalization
    - bolt-export
  priority: high
  status: planning
  promotable: false
  parent_epic: b2g-production-readiness-snapshot
  depends_on:
    - 01-b2g-prs-domain-models-fixtures
  source_document: docs/b2g_production_readiness_snapshot_reference.md

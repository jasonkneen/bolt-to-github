temptations:
  - risk: Do not let detector order or array insertion order decide the final state or top concern ordering.
    instead: Apply explicit severity, category, and evidence ranking rules in the composer and cover ties in fixture tests.
  - risk: Do not show safe-looking areas when the detector that would support the claim did not run.
    instead: Convert missing detector, GitHub, history, or large-file data into limitations and lower confidence.
  - risk: Do not expose internal score as the primary user-facing result.
    instead: Return the score for diagnostics but make state, confidence, headline, recommended action, and evidence the visible contract.
  - risk: Do not make Red export-blocking behavior part of this composer draft.
    instead: Compute state only; any blocking or warning behavior belongs to the later UI/settings integration.

outcome:
  status: completed
  summary: |
    SupabaseAuthService now executes self-heal reload and guided re-auth actions
    directly when the current Chrome context exposes the privileged APIs, while
    preserving runtime-message fallbacks for unprivileged contexts.
  rationale: |
    The background service worker cannot receive its own runtime messages, so
    self-heal reload and re-auth tab opening must not depend on self-addressed
    RELOAD_EXTENSION or OPEN_REAUTHENTICATION messages. Direct alarm/tab
    execution removes the stuck background path, and failed or throttled reload
    requests now clear the in-memory reload gate so later auth failures can
    guide the user back through re-authentication.
  lessons:
    - lesson_type: mv3-runtime-messaging
      summary: |
        Background-owned services should call available privileged Chrome APIs
        directly instead of sending runtime messages back to their own context.
      tags:
        - auth
        - mv3
        - runtime-messaging
      paths:
        - src/content/services/SupabaseAuthService.ts
    - lesson_type: auth-self-healing
      summary: |
        Treat reloadRequested as evidence that reload work was actually
        scheduled. Clear it, and reset the failure threshold, when reload
        scheduling is throttled or fails so the user-visible re-auth path can
        retry.
      tags:
        - auth
        - self-healing
      paths:
        - src/content/services/SupabaseAuthService.ts
        - src/content/services/__tests__/SupabaseAuthService.self-heal-execution.test.ts
